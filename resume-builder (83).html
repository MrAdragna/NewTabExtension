<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume variants</title>
<style>
  :root{
    --ink:#161C22;
    --ink-2:#48555F;
    --ink-3:#7C8A94;
    --line:#D3DAE0;
    --line-soft:#E6EBEF;
    --surface:#E9EDF0;
    --panel:#FFFFFF;
    --accent:#1F6B5C;
    --accent-soft:#E4F0ED;
    --warn:#A8641C;
    --warn-soft:#FBF0E2;
    --ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--surface);
    color:var(--ink);
    font-family:var(--ui);
    font-size:14px;
    line-height:1.45;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- shell ---------- */
  #app{display:flex;flex-direction:column;height:100%}
  .topbar{
    display:flex;align-items:center;gap:8px;flex-wrap:nowrap;
    padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);
  }
  .topbar #variantPick{
    width:auto;min-width:150px;max-width:340px;flex:0 1 auto;text-overflow:ellipsis;
  }
  .btngroup{display:flex;gap:3px;flex:none}
  .btngroup .btn{padding:6px 12px;font-size:16px;line-height:1.1;min-width:38px}
  .topbar .btn{white-space:nowrap}
  .menuwrap{position:relative;flex:none}
  .menu{
    position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:210px;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    box-shadow:0 8px 26px rgba(20,30,40,.16);padding:5px;
  }
  .menu[hidden]{display:none}
  .menuitem{
    display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;
    padding:7px 10px;font-size:13px;color:var(--ink-2);
  }
  .menuitem:hover{background:var(--surface);color:var(--ink)}
  .menusep{height:1px;background:var(--line-soft);margin:5px 2px}
  .menurow{display:flex;align-items:center;gap:8px;padding:5px 10px;font-size:13px;color:var(--ink-2)}
  .menurow select{width:auto;flex:1}
  .savestate{
    font-size:11.5px;color:var(--ink-3);white-space:nowrap;display:flex;gap:6px;align-items:center;
    background:none;border:1px solid transparent;border-radius:6px;padding:4px 8px;
  }
  .savestate:hover{border-color:var(--line);background:var(--panel)}
  .savestate .warn{color:var(--warn)}
  .savestate .ss-sep{opacity:.45}
  .savestate .ss-backup{color:var(--ink-3)}
  .brand{
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-3);padding-right:6px;
  }
  .spacer{flex:1}
  .btn{
    background:var(--panel);border:1px solid var(--line);border-radius:6px;
    padding:6px 11px;color:var(--ink-2);
  }
  .btn:hover{border-color:var(--ink-3);color:var(--ink)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#18574B}
  .btn.danger:hover{border-color:#B4453C;color:#B4453C}
  .btn.sm{padding:3px 8px;font-size:12px;border-radius:5px}
  select,input[type=text],textarea{
    background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px;width:100%;
  }
  textarea{resize:vertical}
  textarea.grow{resize:none;overflow:hidden;min-height:32px}
  label.field{display:block;margin-bottom:10px}
  label.field > span{
    display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-3);margin-bottom:4px;
  }

  .storagebar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:9px 16px;background:var(--warn-soft);border-bottom:1px solid #E6CFA8;
    color:#6B420F;font-size:13px;
  }
  .storagebar[hidden]{display:none}
  .warnbar{background:#EAF1F8;border-bottom-color:#C6D8EA;color:#26506F}
  .warnbar .btn{background:#fff;border-color:#C6D8EA;color:#26506F}
  .storagebar .btn{background:#fff;border-color:#DCC098;color:#6B420F}
  .storagebar .btn:hover{border-color:var(--warn);color:var(--warn)}

  .cols{display:flex;flex:1;min-height:0}
  .histflash{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);z-index:60;
    background:var(--ink);color:#fff;padding:7px 15px;border-radius:99px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .14s,transform .14s;
  }
  .histflash.on{opacity:1;transform:translateX(-50%) translateY(0)}

  .modal-back{
    position:fixed;inset:0;z-index:80;background:rgba(20,30,40,.35);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .modal-back[hidden]{display:none}
  .modal{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 18px 50px rgba(20,30,40,.28);max-width:460px;width:100%;padding:18px 20px;
  }
  .modal-title{font-size:15px;font-weight:600;margin-bottom:8px}
  .modal-body{font-size:13.5px;color:var(--ink-2);line-height:1.5;margin-bottom:16px}
  .modal-body ul{margin:8px 0 0;padding-left:18px}
  .modal-body li{margin-bottom:3px}
  .modal-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  .notes-fab{
    position:fixed;right:18px;bottom:18px;z-index:40;width:44px;height:44px;border-radius:50%;
    background:var(--ink);color:#fff;border:0;font-size:17px;line-height:1;
    box-shadow:0 3px 10px rgba(20,30,40,.24);display:flex;align-items:center;justify-content:center;
  }
  .notes-fab:hover{background:#000}
  .notes-badge{
    position:absolute;top:-3px;right:-3px;background:var(--warn);color:#fff;border-radius:99px;
    font-size:10px;font-family:var(--mono);min-width:17px;height:17px;display:flex;
    align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--surface);
  }
  .notes-panel{
    position:fixed;right:18px;bottom:72px;z-index:41;width:330px;max-width:calc(100vw - 36px);
    max-height:min(60vh,460px);background:var(--panel);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 10px 34px rgba(20,30,40,.20);display:flex;flex-direction:column;overflow:hidden;
  }
  .notes-panel[hidden]{display:none}
  .notes-head{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line-soft)}
  .notes-list{flex:1;overflow:auto;padding:8px 12px}
  .notes-item{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
  .notes-item:last-child{border-bottom:0}
  .notes-item.sel{background:var(--accent-soft);border-radius:6px;padding-left:6px;padding-right:6px}
  .notes-item.done span{color:var(--ink-3);text-decoration:line-through}
  .notes-arch{margin-top:8px;border-top:1px solid var(--line-soft);padding-top:6px}
  .notes-archhead{
    background:none;border:0;color:var(--ink-3);font-size:11.5px;font-family:var(--mono);
    letter-spacing:.06em;text-transform:uppercase;padding:4px 0;width:100%;text-align:left;
  }
  .notes-archhead:hover{color:var(--ink)}
  .notes-item input{margin-top:2px;flex:none}
  .notes-item span{flex:1}
  .notes-when{font-family:var(--mono);font-size:10px;color:var(--ink-3);display:block;margin-top:2px}
  .notes-new{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line-soft);align-items:flex-end}
  #notesInput{resize:none;overflow-y:auto;max-height:150px;min-height:34px}
  .notes-empty{color:var(--ink-3);font-size:12.5px;text-align:center;padding:18px 4px}

  @media print{ #app{transform:none !important;width:auto !important;height:auto !important} }
  .editor{
    width:46%;min-width:380px;overflow:auto;padding:16px 18px 80px;
    border-right:1px solid var(--line);background:var(--surface);
  }
  .stage{flex:1;overflow:auto;padding:0 22px 22px;display:flex;flex-direction:column;align-items:center;gap:12px}

  .tabs{display:flex;gap:4px;margin-bottom:14px}
  .subtabs{display:flex;gap:3px;margin:0 0 16px;flex-wrap:wrap}
  .subtab{
    border:1px solid transparent;background:none;border-radius:6px;padding:5px 11px;
    color:var(--ink-3);font-size:13px;
  }
  .subtab:hover{color:var(--ink);background:var(--panel)}
  .subtab[aria-selected=true]{background:var(--panel);border-color:var(--line);color:var(--ink);font-weight:600}

  .tabs.sticky{
    position:sticky;top:0;z-index:5;margin:-16px -18px 14px;padding:10px 18px;
    background:var(--surface);border-bottom:1px solid var(--line);
  }
  .tab{
    border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 12px;color:var(--ink-3);
  }
  .tab[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:#fff}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
  .card.off{opacity:.6}
  .card.tight{padding:8px 12px;margin-bottom:6px}
  .card.tight .seg button{padding:2px 8px;font-size:11.5px}
  .card-head{display:flex;align-items:flex-start;gap:10px}
  .card-title{font-weight:600}
  .card-sub{font-size:12.5px;color:var(--ink-3)}
  h3.sec{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-3);margin:20px 0 8px;font-weight:600;
  }
  h3.sec:first-child{margin-top:0}

  .seg{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
  .seg button{
    border:1px solid var(--line);background:var(--panel);color:var(--ink-3);
    border-radius:6px;padding:4px 10px;font-size:12.5px;
  }
  .seg button:hover{border-color:var(--ink-3);color:var(--ink)}
  .seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
  .seg button[aria-pressed=true]:hover{color:#fff}

  .switch{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
  input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;margin:0}

  /* bullets */
  .bullets{margin-top:10px;border-top:1px solid var(--line-soft)}
  .bl{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--line-soft);align-items:flex-start}
  .bl:last-child{border-bottom:0}
  .bl-txt{flex:1;font-size:13px;min-width:0;overflow-wrap:anywhere}
  .bl.unused .bl-txt{color:var(--ink-3)}
  .bl-ord{
    font-family:var(--mono);font-size:10px;color:var(--ink-3);width:16px;padding-top:2px;text-align:right;
  }
  .arrows{display:flex;flex-direction:column;gap:2px}
  .arrow{
    border:1px solid var(--line);background:var(--panel);border-radius:4px;line-height:1;
    padding:1px 5px;font-size:10px;color:var(--ink-3);
  }
  .arrow:disabled{opacity:.3;cursor:default}
  .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
  .tag{
    font-family:var(--mono);font-size:10px;letter-spacing:.04em;background:var(--surface);
    border:1px solid var(--line-soft);color:var(--ink-3);border-radius:99px;padding:1px 7px;
  }
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
  .chip{
    font-size:12.5px;background:var(--panel);border:1px solid var(--line);color:var(--ink-3);
    border-radius:99px;padding:3px 11px;cursor:pointer;user-select:none;
    white-space:normal;overflow-wrap:anywhere;text-align:left;max-width:100%;
  }
  .chip:hover{border-color:var(--ink-3);color:var(--ink)}
  .chip.on{background:var(--accent-soft);border-color:var(--accent);color:#14503F}
  .chip.static{cursor:default}
  .chip.static:hover{border-color:var(--line);color:var(--ink-3)}
  .chip.on.static:hover{border-color:var(--accent);color:#14503F}

  .zone{border:1px dashed var(--line);border-radius:8px;padding:6px 8px;background:var(--panel);min-height:44px;margin-bottom:12px}
  .zone.valid{border-color:var(--accent);background:var(--accent-soft);border-style:solid}
  .zone.invalid{opacity:.4}
  .zone.over{border-color:var(--accent);background:#D8EAE5;border-style:solid}
  .dropline{
    height:0;border-top:2px solid var(--accent);margin:2px 0;position:relative;pointer-events:none;
  }
  .dropline::before{
    content:"";position:absolute;left:-3px;top:-4px;width:7px;height:7px;border-radius:50%;
    background:var(--accent);
  }
  .zone-empty{color:var(--ink-3);font-size:12.5px;padding:10px 4px;text-align:center}
  .zone.staging{border-color:#C9A227;background:#FDF8E7}
  .zone.shelf{background:var(--surface)}
  .zone.backburner{background:var(--surface);opacity:.85;border-style:dotted}
  .availlist{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:4px 10px;margin-bottom:12px}
  .bl.avail{gap:8px;align-items:center}
  .bl.avail .bl-txt{color:var(--ink-2)}
  .bl.avail .btn{flex:none;white-space:nowrap}
  .blwrap.editing{background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:2px 8px 8px;margin:4px 0}
  .inlineedit{padding:0 2px 4px}
  .arrow.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .zone.backburner .bl-txt{color:var(--ink-3)}
  .appcard{
    margin-top:10px;padding:12px;background:var(--surface);border:1px solid var(--line-soft);border-radius:8px;
  }
  .jobbullets .bulletcard{background:var(--panel)}
  .jobbullets .bulletcard textarea{background:var(--surface)}
  .appgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px 10px}
  .fieldlabel{
    display:flex;align-items:center;gap:6px;width:100%;background:none;border:0;padding:0 0 4px;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-3);text-align:left;
  }
  .fieldlabel:hover{color:var(--accent)}
  /* Filled and empty rows render identically — same chip, same height, same hover. */
  .copyhint{
    font-size:9px;letter-spacing:.06em;color:var(--accent);background:var(--accent-soft);
    border-radius:99px;padding:1px 6px;opacity:0;transition:opacity .12s;
  }
  .fieldlabel:hover .copyhint{opacity:1}
  .appfield input{width:100%}
  .factgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
  .factcard{
    display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;overflow:hidden;
  }
  .factcard:hover{border-color:var(--ink-3)}
  .factcard.editing{display:block;padding:10px;border-color:var(--accent)}
  .factmain{
    flex:1;min-width:0;background:none;border:0;text-align:left;padding:8px 10px;
    display:flex;flex-direction:column;gap:2px;
  }
  .factmain:hover{background:var(--accent-soft)}
  .factlbl{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  }
  .factval{font-size:13.5px;color:var(--ink);overflow-wrap:anywhere}
  .factval.none{color:var(--ink-3);font-style:italic}
  .factedit{
    background:none;border:0;border-left:1px solid var(--line-soft);color:var(--ink-3);
    padding:0 9px;font-size:12px;
  }
  .factedit:hover{background:var(--surface);color:var(--ink)}
  .factlabel{margin-bottom:6px}
  @media (max-width:640px){ .appgrid{grid-template-columns:1fr} }

  .poolhead{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--ink-3);margin:18px 0 8px;display:flex;align-items:center;gap:6px;
  }
  .poolhead:first-of-type{margin-top:6px}

  .filterbar{display:flex;gap:6px;margin-bottom:12px}
  .filterbar input{flex:1}

  .cattabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
  .cattab{
    border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 11px;
    color:var(--ink-3);font-size:13px;display:flex;align-items:center;gap:6px;
  }
  .cattab:hover{border-color:var(--ink-3);color:var(--ink)}
  .cattab[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:#fff}
  .cattab[aria-selected=true] .catcount{background:rgba(255,255,255,.22);color:#fff}
  .cattab.add{border-style:dashed;color:var(--ink-3)}
  .catcount{
    font-family:var(--mono);font-size:10px;background:var(--surface);color:var(--ink-3);
    border-radius:99px;padding:1px 6px;
  }
  .catpanel{margin-bottom:16px}

  .bulletcard{padding:10px 12px;margin-bottom:8px}
  .bulletcard textarea{border-color:transparent;background:var(--surface);padding:7px 9px}
  .bulletcard textarea:hover{border-color:var(--line)}
  .bulletcard textarea:focus{border-color:var(--accent);background:var(--panel)}
  .metarow{display:flex;align-items:center;gap:8px;margin-top:6px}
  .chips.tight{gap:3px;margin:0;flex:1;min-width:0}
  .chip.mini{font-size:11px;padding:2px 8px}
  .elig-toggle.mini{width:auto;padding:2px 6px;gap:5px;flex:none;border-radius:6px}
  .elig-toggle.mini:hover{background:var(--surface)}
  .nojobs{font-size:11px;color:var(--warn)}

  .elig-toggle{
    background:none;border:0;color:var(--ink-3);font-size:11.5px;padding:8px 0 0;
    display:flex;align-items:center;gap:7px;width:100%;text-align:left;
  }
  .elig-toggle:hover{color:var(--ink)}
  .elig-dots{display:inline-flex;gap:3px}
  .ed{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle}
  .ed-cat{background:#1F6B5C}
  .ed-add{background:#2A5E93}
  .ed-ex{background:#B4453C}
  .chip.elig.cat{background:#E4F0ED;border-color:#1F6B5C;color:#14503F}
  .chip.elig.add{background:#E3EDF6;border-color:#2A5E93;color:#1D4467}
  .chip.elig.ex{background:#F8E7E7;border-color:#B4453C;color:#8A322B;text-decoration:line-through}
  .chip.elig.no{background:var(--panel);border-color:var(--line);color:var(--ink-3)}

  .sumlib{margin-top:8px;border-top:1px solid var(--line-soft);padding-top:8px;max-height:260px;overflow:auto}
  .sumitem{padding:8px 0;border-bottom:1px solid var(--line-soft)}
  .sumitem:last-child{border-bottom:0}
  .sumrow{
    display:flex;align-items:center;gap:7px;width:100%;background:none;border:0;
    padding:5px 0;text-align:left;color:var(--ink-2);
  }
  .sumrow:hover{color:var(--ink)}
  .sumcaret{color:var(--ink-3);font-size:10px}
  .sumfor{font-size:12px;font-weight:600;flex:1}
  .sumtext{font-size:12.5px;color:var(--ink-2)}
  .selectable{user-select:text;cursor:text;background:var(--surface);border-radius:5px;padding:7px 9px;margin-top:4px}

  .grouphead{
    display:flex;align-items:center;gap:8px;margin:-14px -14px 12px;padding:9px 14px;
    background:var(--surface);border-bottom:1px solid var(--line);border-radius:7px 7px 0 0;
  }
  .grouptitle{
    font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
    font-weight:600;color:var(--ink);background:none;border:1px solid transparent;padding:4px 6px;
  }
  .grouptitle:hover{border-color:var(--line);background:var(--panel)}
  .grouptitle:focus{border-color:var(--accent);background:var(--panel)}

  .skillhead span{
    font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;
    font-weight:600;color:var(--ink);
  }
  .zone.skillzone{min-height:36px;padding:4px 8px}
  .bl.drag.sk{padding:5px 4px;font-size:12.5px}
  .bl.drag.sk .bl-txt{font-size:12.5px}
  .bl.drag{cursor:default;padding:7px 4px}
  .bl.drag.dragging{opacity:.4}
  .grip{color:var(--ink-3);cursor:grab;font-size:14px;line-height:1;padding-top:2px;user-select:none}
  .grip:active{cursor:grabbing}
  .blmeta{display:flex;gap:8px;align-items:center;margin-top:5px;flex-wrap:wrap}
  .vercycle{display:flex;align-items:center;gap:3px}
  .verno{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
  .jobdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}




  .tagbar{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 14px}
  .tagbtn{
    font-family:var(--mono);font-size:11px;background:var(--panel);border:1px solid var(--line);
    color:var(--ink-2);border-radius:99px;padding:3px 10px;
  }
  .tagbtn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
  .slidewrap{display:block;position:relative}
  .idealmark{
    position:absolute;top:5px;width:2px;height:13px;background:var(--ink);opacity:.7;
    transform:translateX(-1px);pointer-events:none;border-radius:1px;z-index:2;
  }
  .band{
    position:absolute;top:8px;height:4px;background:#E9C4C0;border-radius:99px;pointer-events:none;
  }
  .band.ok{background:#BFDCD3}
  input[type=range]{
    -webkit-appearance:none;appearance:none;background:transparent;width:100%;height:20px;border:0;padding:0;
  }
  input[type=range]::-webkit-slider-runnable-track{height:4px;background:#D8DEE3;border-radius:99px}
  input[type=range]::-moz-range-track{height:4px;background:#D8DEE3;border-radius:99px}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--accent);
    border:2px solid #fff;margin-top:-5.5px;box-shadow:0 0 0 1px var(--line);
  }
  input[type=range]::-moz-range-thumb{
    width:15px;height:15px;border-radius:50%;background:var(--accent);border:2px solid #fff;
  }

  .rowline{display:flex;gap:8px;align-items:center}
  .rowline > *{min-width:0}
  .hint{font-size:12px;color:var(--ink-3);margin:-4px 0 12px}
  .empty{
    border:1px dashed var(--line);border-radius:8px;padding:22px;text-align:center;color:var(--ink-3);
    background:var(--panel);
  }

  /* ---------- gauge ---------- */
  .gauge{
    position:sticky;top:0;z-index:6;background:var(--surface);padding:8px 0 10px;
    width:8.5in;max-width:100%;display:flex;align-items:center;gap:10px;
    font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase;
  }
  .meter{flex:1;height:5px;background:#D8DEE3;border-radius:99px;overflow:hidden}
  .meter > i{display:block;height:100%;background:var(--accent);width:0}
  .gauge.over{color:var(--warn)}
  .gauge.over .meter > i{background:var(--warn)}

  /* ---------- the sheet ---------- */
  .sheet{
    width:8.5in;min-height:11in;background:#fff;box-shadow:0 1px 2px rgba(20,30,40,.10),0 12px 30px rgba(20,30,40,.10);
    flex:none;
  }
  .page-rule{
    position:relative;
  }
  .page-rule::after{
    content:"";position:absolute;left:0;right:0;top:11in;border-top:1px dashed #C6A26B;
  }
  .doc{
    font-family:Calibri,Carlito,Arial,Helvetica,sans-serif;
    color:#000;
  }
  .doc h1{font-size:1.55em;margin:0 0 2px;letter-spacing:.01em}
  .doc .contact{margin:0 0 1em}
  .doc [data-jump],.doc [data-item]{cursor:pointer}
  .doc [data-jump]:hover{background:#EEF4FF;box-shadow:-4px 0 0 #EEF4FF,4px 0 0 #EEF4FF}
  .doc li[data-item]:hover{background:#EEF4FF;box-shadow:-4px 0 0 #EEF4FF,4px 0 0 #EEF4FF;border-radius:2px}
  .doc span[data-item]:hover{background:#EEF4FF;border-radius:2px;box-shadow:-2px 0 0 #EEF4FF,2px 0 0 #EEF4FF}
  h3.sec.jumped{color:var(--accent)}
  .flash{box-shadow:0 0 0 2px var(--accent);border-radius:8px}
  .doc h2{
    font-size:1em;margin:1.1em 0 .35em;padding-bottom:2px;border-bottom:1px solid #000;
    text-transform:uppercase;letter-spacing:.06em;
  }
  .doc .job{margin-bottom:.7em}
  .doc .job-a{font-weight:700}
  .doc .job-b{display:flex;justify-content:space-between;gap:12px}
  .doc ul{margin:.25em 0 0;padding-left:0;list-style:none}
  .doc li{margin-bottom:.15em;padding-left:1.1em;text-indent:-1.1em}
  .doc .bp{display:inline-block;width:1.1em;text-indent:0}
  /* Skills: label stays put, wrapped items align under the first item */
  .doc p.skill{padding-left:1.1em;text-indent:-1.1em;margin:0}
  .doc p{margin:0}
  .doc p.runlist{margin:.15em 0 .5em}
  .inlinectl{display:inline-flex;align-items:center;gap:2px;margin-left:6px;vertical-align:baseline}
  .ictl{
    background:#fff;border:1px solid var(--accent);border-radius:4px;color:var(--accent);
    font-size:9px;line-height:1.2;padding:1px 4px;font-family:var(--ui);
  }
  .ictl:disabled{opacity:.35}
  .ictl.on{background:#E0B44A;border-color:#C79B2E;color:#4A3A0E}
  .tri{display:inline-flex;gap:2px;align-items:center;margin-left:2px}
  .tri-b{
    width:15px;height:15px;border-radius:50%;border:1px solid rgba(0,0,0,.18);
    font-size:0;line-height:0;padding:0;background:#fff;
  }
  .tri-b.red{background:#F3C3BA}
  .tri-b.yel{background:#F2DFA6}
  .tri-b.grn{background:#BFDCD3}
  .tri-b:hover{transform:scale(1.18)}
  .tri-b.on{box-shadow:0 0 0 2px var(--ink)}
  .ictl.done{background:var(--accent);border-color:var(--accent);color:#fff}
  .ictl-n{font-family:var(--mono);font-size:8.5px;color:var(--accent)}
  .doc-ta{
    width:100%;font:inherit;background:#fff;border:1px solid var(--accent);border-radius:4px;
    padding:3px 6px;resize:none;overflow:hidden;text-indent:0;
  }
  .doc li[data-dragbullet]{cursor:grab}
  .doc li.dragging{opacity:.35}
  .docdropline{
    list-style:none;height:0;border-top:2px solid var(--accent);margin:2px 0;padding:0;
  }
  .doc li.is-editing{
    text-indent:0;padding-left:1.1em;background:#FFFDF0;border-radius:4px;
    box-shadow:0 0 0 2px var(--accent), 0 2px 10px rgba(31,107,92,.18);
    padding-top:4px;padding-bottom:4px;margin:3px 0;position:relative;
  }
  .doc li.is-editing .bp{color:var(--accent);font-weight:700}
  .doc li.is-editing::after{
    content:"editing";position:absolute;top:-9px;right:6px;background:var(--accent);color:#fff;
    font-family:var(--ui);font-size:8px;letter-spacing:.1em;text-transform:uppercase;
    padding:1px 6px;border-radius:99px;
  }
  .movepop{
    display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;padding-top:6px;
    border-top:1px solid rgba(31,107,92,.2);
  }

  /* Two states only: not yet looked at, and decided to keep. */
  .doc .is-reviewed{background:none}
  /* Review state on screen: pink = untouched, yellow = keeping it, none = done. */
  .doc .not-seen{background:#FBEAE6;border-radius:3px;box-shadow:-3px 0 0 #FBEAE6,3px 0 0 #FBEAE6}
  .doc .is-kept{background:#FBF3DC;border-radius:3px;box-shadow:-3px 0 0 #FBF3DC,3px 0 0 #FBF3DC}
  .doc .is-sel.not-seen,.doc .is-sel.is-kept{background:#D5E9E2}
  .doc .is-sel.is-todo{background:#D5E9E2}
  .doc .is-done-chip{
    font-size:8.5px;font-family:var(--ui);letter-spacing:.06em;text-transform:uppercase;
    color:var(--accent);margin-left:6px;
  }
  .todobar{
    width:8.5in;max-width:100%;display:flex;align-items:center;gap:10px;font-size:11.5px;
    color:var(--ink-3);padding-bottom:4px;
  }
  .todobar b{font-family:var(--mono);color:var(--ink-2);font-weight:500}
  .dot-keep,.dot-word{
    display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle;
  }
  .dot-keep{background:#FBE4E0}
  .dot-word{background:#FDF3D8;margin-left:10px}

  .doc .is-sel{
    background:#D5E9E2;border-radius:3px;
    box-shadow:-5px 0 0 #D5E9E2, 5px 0 0 #D5E9E2, 0 0 0 2px var(--accent);
    position:relative;
  }
  .doc li.is-sel::marker{color:var(--accent)}
  .doc .is-sel .bp{color:var(--accent);font-weight:700}
  .inspect-head{
    display:flex;align-items:center;gap:8px;padding-bottom:10px;margin-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .inspect-kind{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-3);font-weight:600;
  }
  .vercard{
    border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:8px;background:var(--panel);
  }
  .rolecard{cursor:default}
  .rolecard.dragging{opacity:.4}
  .rolecard.drop-above{box-shadow:0 -3px 0 var(--accent)}
  .rolecard.drop-below{box-shadow:0 3px 0 var(--accent)}
  .vercard{cursor:pointer}
  .vercard.active{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
  .statedot{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}
  .statedot.todo{background:#E8A79C}
  .statedot.warn{background:#E0B44A}
  .statedot.ok{background:transparent;border:1px solid var(--line)}
  .vercard.active textarea{background:#fff}
  .verpick{
    background:none;border:0;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink-3);padding:0;
  }
  .verpick.on{color:var(--accent);font-weight:600}
  .verpick:hover{color:var(--ink)}

  .docband{
    border:1px dashed var(--line);border-radius:6px;padding:7px 9px;margin:0 0 .9em;
    font-size:.92em;line-height:1.35;text-indent:0;
  }
  .docband *{text-indent:0}
  .draftband{border-color:#C9A227;background:#FDF8E7}
  .shelfband{border-color:#8FB3C9;background:#EFF5F9}
  .availband{border-color:var(--line);background:#F7F8F9}
  .asidepanel{
    width:8.5in;max-width:100%;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:12px 14px;margin-top:4px;
  }
  .asidehead{display:flex;align-items:center;gap:10px;font-size:13px}
  .asidegroup{margin-top:10px}
  .asidegroup-h{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--ink-3);margin-bottom:4px;
  }
  .asideband{border-color:#C9B8B6;background:#F8F4F3}
  .asideband .band-tag{color:#7A5F5C}
  .band-row.aside{align-items:center}
  .aside-kind{
    font-family:var(--mono);font-size:8px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-3);flex:none;min-width:78px;
  }
  .band-tag{
    display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:0 0 5px;
    font-family:var(--ui);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-3);text-align:left;cursor:pointer;
  }
  .band-tag.plain{cursor:default}
  .draftband .band-tag{color:#8A6D12}
  .shelfband .band-tag{color:#3D6C88}
  .band-chip{
    font-size:8.5px;letter-spacing:.06em;background:rgba(0,0,0,.06);border-radius:99px;
    padding:1px 6px;opacity:0;transition:opacity .12s;
  }
  .band-tag:hover .band-chip{opacity:1}
  .band-level{margin-bottom:4px}
  .band-lvl{
    display:inline-block;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-3);margin:2px 0 2px 2px;
  }
  .band-row{display:flex;align-items:flex-start;gap:6px;padding:3px 5px;border-radius:4px}
  .band-row.not-seen{background:#FBEAE6}
  .band-row.is-kept{background:#FBF3DC}
  .band-row.band-sel{background:#D5E9E2;border-radius:5px;box-shadow:0 0 0 2px var(--accent)}
  .band-row.editing{background:#fff;border-radius:5px;padding:4px}
  .band-body{
    flex:1;background:none;border:0;text-align:left;font:inherit;color:inherit;
    padding:1px 3px;border-radius:4px;cursor:text;
  }
  .band-body.static{cursor:default}
  .band-body:not(.static):hover{background:rgba(255,255,255,.8)}
  .band-ta{
    flex:1;font:inherit;background:#fff;border:1px solid var(--accent);border-radius:5px;
    padding:5px 7px;resize:none;overflow:hidden;
  }
  .band-acts{display:flex;gap:2px;flex-wrap:wrap;flex:none;align-items:center}
  .band-ver{display:flex;align-items:center;gap:2px}
  .band-btn{
    background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.1);border-radius:4px;
    font-size:9.5px;line-height:1.3;padding:2px 5px;color:var(--ink-2);white-space:nowrap;
  }
  .band-btn:hover{border-color:var(--ink-3);color:var(--ink)}
  .band-btn.go{border-color:var(--accent);color:var(--accent)}
  .band-btn:disabled{opacity:.35}
  .band-add{
    background:none;border:1px dashed rgba(0,0,0,.2);border-radius:5px;color:var(--ink-3);
    font-size:9.5px;padding:3px 8px;margin-top:4px;
  }

  .stageband{
    border:1px dashed #C9A227;background:#FDF8E7;border-radius:4px;padding:8px 10px;margin:0 0 1em;
  }
  .stageband-tag{
    font-family:var(--ui);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
    color:#8A6D12;margin-bottom:5px;
  }
  .stageband-tag.copyall{
    display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;
    padding:0 0 5px;text-align:left;cursor:pointer;
  }
  .stageband-tag.copyall:hover{color:#6B5410}
  .sb-copychip{
    font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#8A6D12;
    background:#F3E4BB;border-radius:99px;padding:1px 7px;opacity:0;transition:opacity .12s;
  }
  .stageband-tag.copyall:hover .sb-copychip{opacity:1}

  .sb-item{
    display:flex;align-items:flex-start;gap:7px;padding:3px 0;color:#6B5410;
    border-bottom:1px solid #EFE3C4;
  }
  .sb-item:last-child{border-bottom:0}
  .sb-item.kept{color:#14503F}
  .sb-item.editing{background:#FFFDF5;border-radius:5px;padding:5px 4px}
  .sb-keep{
    background:none;border:0;color:#C9A227;font-size:14px;line-height:1.2;padding:0 2px;flex:none;
  }
  .sb-item.kept .sb-keep{color:var(--accent)}
  .sb-body{
    flex:1;background:none;border:0;text-align:left;color:inherit;font:inherit;
    padding:1px 2px;border-radius:4px;cursor:text;
  }
  .sb-body:hover{background:#FBF3DC}
  .sb-item.kept .sb-body:hover{background:#E4F0ED}
  .sb-text{
    flex:1;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--accent);
    border-radius:5px;padding:5px 7px;resize:none;overflow:hidden;
  }
  .sb-actions{display:flex;gap:2px;flex:none}
  .sb-btn{
    background:none;border:1px solid transparent;border-radius:4px;color:#A08434;
    font-size:11px;line-height:1;padding:2px 5px;
  }
  .sb-btn:hover{border-color:#D9C089;background:#FBF3DC}
  .shelfband{
    border:1px dashed #8FA6B8;background:#F1F5F8;border-radius:4px;padding:8px 10px;margin:0 0 1em;
  }
  .shelfband .stageband-tag{color:#456177}
  .shelfrow{display:flex;align-items:flex-start;gap:8px;padding:3px 0}
  .shelfrow.editing{display:block}
  .shelftext{
    flex:1;text-align:left;background:none;border:0;padding:2px 4px;color:#3A4E5D;
    font:inherit;border-radius:3px;cursor:text;
  }
  .shelftext:hover{background:#E3ECF3}
  .shelfctl{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
  .shelfrow.editing .shelfctl{margin-top:6px}
  .pill{
    font-size:10px;font-family:var(--ui);border:1px solid var(--line);background:#fff;
    border-radius:99px;padding:1px 7px;color:var(--ink-3);white-space:nowrap;
  }
  .pill:hover{background:var(--surface)}
  .shelfta{width:100%;font:inherit;background:#fff}

  @media (max-width:900px){
    .cols{flex-direction:column}
    .editor{width:100%;min-width:0;border-right:0;border-bottom:1px solid var(--line);max-height:none}
    .stage{padding:14px}
    .sheet,.gauge{width:100%}
  }

  .histflash{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);z-index:60;
    background:var(--ink);color:#fff;padding:7px 15px;border-radius:99px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .14s,transform .14s;
  }
  .histflash.on{opacity:1;transform:translateX(-50%) translateY(0)}

  .modal-back{
    position:fixed;inset:0;z-index:80;background:rgba(20,30,40,.35);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .modal-back[hidden]{display:none}
  .modal{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 18px 50px rgba(20,30,40,.28);max-width:460px;width:100%;padding:18px 20px;
  }
  .modal-title{font-size:15px;font-weight:600;margin-bottom:8px}
  .modal-body{font-size:13.5px;color:var(--ink-2);line-height:1.5;margin-bottom:16px}
  .modal-body ul{margin:8px 0 0;padding-left:18px}
  .modal-body li{margin-bottom:3px}
  .modal-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  .notes-fab{
    position:fixed;right:18px;bottom:18px;z-index:40;width:44px;height:44px;border-radius:50%;
    background:var(--ink);color:#fff;border:0;font-size:17px;line-height:1;
    box-shadow:0 3px 10px rgba(20,30,40,.24);display:flex;align-items:center;justify-content:center;
  }
  .notes-fab:hover{background:#000}
  .notes-badge{
    position:absolute;top:-3px;right:-3px;background:var(--warn);color:#fff;border-radius:99px;
    font-size:10px;font-family:var(--mono);min-width:17px;height:17px;display:flex;
    align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--surface);
  }
  .notes-panel{
    position:fixed;right:18px;bottom:72px;z-index:41;width:330px;max-width:calc(100vw - 36px);
    max-height:min(60vh,460px);background:var(--panel);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 10px 34px rgba(20,30,40,.20);display:flex;flex-direction:column;overflow:hidden;
  }
  .notes-panel[hidden]{display:none}
  .notes-head{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line-soft)}
  .notes-list{flex:1;overflow:auto;padding:8px 12px}
  .notes-item{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
  .notes-item:last-child{border-bottom:0}
  .notes-item.sel{background:var(--accent-soft);border-radius:6px;padding-left:6px;padding-right:6px}
  .notes-item.done span{color:var(--ink-3);text-decoration:line-through}
  .notes-arch{margin-top:8px;border-top:1px solid var(--line-soft);padding-top:6px}
  .notes-archhead{
    background:none;border:0;color:var(--ink-3);font-size:11.5px;font-family:var(--mono);
    letter-spacing:.06em;text-transform:uppercase;padding:4px 0;width:100%;text-align:left;
  }
  .notes-archhead:hover{color:var(--ink)}
  .notes-item input{margin-top:2px;flex:none}
  .notes-item span{flex:1}
  .notes-when{font-family:var(--mono);font-size:10px;color:var(--ink-3);display:block;margin-top:2px}
  .notes-new{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line-soft);align-items:flex-end}
  #notesInput{resize:none;overflow-y:auto;max-height:150px;min-height:34px}
  .notes-empty{color:var(--ink-3);font-size:12.5px;text-align:center;padding:18px 4px}

  @media print{
    body{background:#fff}
    .topbar,.editor,.gauge,.storagebar,.notes-fab,.notes-panel,.menu,
    .todobar,.subtabs,.tabs,.asidepanel{display:none !important}
    .cols,.stage{display:block;padding:0;overflow:visible}
    .sheet{width:auto !important;min-height:0 !important;height:auto !important;box-shadow:none;background:none !important;border:0 !important}
    .stage{gap:0 !important}
    .doc > *:last-child{margin-bottom:0 !important}
    .doc .job:last-child{margin-bottom:0 !important}
    html,body{height:auto !important}
    .page-rule::after{display:none}
    .doc ul{list-style:none !important;padding-left:0 !important;margin-left:0 !important}
    .doc li{display:block !important;padding-left:1.1em !important;text-indent:-1.1em !important}
    .doc .bp{display:inline-block !important;width:1.1em !important;text-indent:0 !important}
    /* Nothing about review state or selection may reach paper. */
    .doc .not-seen,.doc .is-kept,.doc .is-sel,.doc .is-editing,.doc [class*="needs-"]{
      background:none !important;box-shadow:none !important;outline:none !important;
      border:0 !important;
    }
    .doc .not-seen::before,.doc .is-kept::before,.doc .is-sel::before,
    .doc .not-seen::after,.doc .is-kept::after,.doc .is-editing::after{content:none !important}
    .inlinectl,.ictl,.movepop,.doc-ta,.docdropline,.band-acts,.statedot{display:none !important}
    .stageband,.shelfband,.docband{display:none !important}

  /* Review state reads two ways: an underline on the text and a gutter marker,
     so a glance down the left edge shows what is still outstanding. */

    .doc [data-jump],.doc [data-item],.doc li[data-dragbullet]{cursor:auto}

<script>
const KEY = 'resume-builder-v1';
const uid = p => p + '_' + Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------- state ---------------- */
let data, ui = { tab: 'variant', libTab: 'header', varTab: 'header', catOpen: null, appOpen: {}, jbOpen: {}, factEdit: null, factMenuOpen: false, refOpen: {}, inlineEdit: {}, onlyOnResume: false, sbEdit: null, draftEdit: null, sel: null,
  docEdit: null, bandEdit: null, editOkFor: null, asideOpen: {}, moveOpen: null, shelfEdit: null, scroll: {}, peek: {}, eligOpen: {}, sumOpen: false, sumItemOpen: {} };
let fitTimer, fitting = false;

function sampleData(){
  const r1 = uid('r'), r2 = uid('r'), c1 = uid('cat');
  const b = (t, cats, add) => ({ id: uid('b'), text:t, tags:[], cats:cats||[], add:add||[], ex:[] });
  return {
    profile: { name:'Your Name', line1:'you@email.com | (555) 555-5555 | City, ST', line2:'' },
    sections: [ { id:'sec_exp', label:'Experience' }, { id:'sec_add', label:'Additional Experience' } ],
    roles: [
      { id:r1, sectionId:'sec_exp', company:'Most Recent Employer', title:'Your Title',
        location:'City, ST', dates:'2022 – Present' },
      { id:r2, sectionId:'sec_exp', company:'Previous Employer', title:'Your Title',
        location:'City, ST', dates:'2019 – 2022' },
    ],
    categories: [ { id:c1, label:'Applies to both jobs', roles:[r1, r2] } ],
    bullets: [
      b('Something you did at both jobs.\n\nAn alternate wording of the same thing.', [c1]),
      b('Something specific to your current job.', [], [r1]),
    ],
    education: [ { id:uid('e'), school:'Your School', degree:'Your Degree', detail:'', dates:'2019' } ],
    skillGroups: [ { id:uid('s'), label:'Skills', items:[{ id:uid('si'), text:'First skill', tag:'' }] } ],
    variants: [],
  };
}

function newVariant(name){
  const v = { id: uid('v'), name: name || 'Untitled variant', note:'',
    posting:'', postingUrl:'',
    headline:'', showHeadline:true, summary:'', showSummary:false,
    roles:{}, eduOn:{}, skillsOn:{}, skillItems:{},
    fontSize:10.5, lineHeight:1.22, margin:0.55, sectionGap:1.0 };
  data.roles.forEach(r => v.roles[r.id] = { place: r.sectionId, title:'' });
  v.place = {}; v.order = {};
  data.education.forEach(e => v.eduOn[e.id] = true);
  v.skillSeen = {};
  data.skillGroups.forEach(s => { v.skillsOn[s.id] = true; v.skillItems[s.id] = s.items.map(i=>i.id); v.skillSeen[s.id] = s.items.map(i=>i.id); });
  return v;
}

function slug(t){
  return String(t || '')
    .replace(/[\u2013\u2014]/g, '-')
    .replace(/[^A-Za-z0-9\s-]/g, ' ')      // drop punctuation; dates and codes survive as words
    .split(/\s+/).filter(Boolean)
    .map(w => w[0].toUpperCase() + w.slice(1))
    .join('-')
    .replace(/-{2,}/g, '-')
    .replace(/^-|-$/g, '');
}

// Convention: FirstLast-Resume-Target. No dates, no v2, no "final".
// Best guess at the role title from the job field. Splits on dashes, pipes and
// middots, drops anything that reads as status metadata, and takes the first
// remaining piece — the title in "Title — Employer".
const METAISH = /(closes?|due|applied|apply|deadline|interview|posted|submitted|ref\b|req\b)|\d{1,2}\/\d{1,2}/i;
function jobTitleFrom(note){
  const parts = String(note || '')
    .split(/\s*(?:[\u00b7|;]|\s[\u2013\u2014-]\s)\s*/)
    .map(t => t.trim())
    .filter(Boolean)
    .filter(t => !METAISH.test(t));
  return parts.length ? parts[0] : '';   // "Title — Employer": the title leads
}
function autoHeadline(v){
  const t = (v.roleTitle || '').trim();
  return t ? 'Applying for: ' + t : '';
}

function autoFilename(v){
  const who = slug(data.profile.name) || 'Resume';
  const explicit = (v.roleTitle || '').trim();
  const target = slug(explicit || String(v.note || '').split(/\s*(?:[\u00b7|;]|\s[\u2013\u2014-]\s)\s*/).filter(Boolean).slice(0,2).join(' '))
    .split('-')
    .filter(w => !/^\d+$/.test(w))       // grade ranges and dates add nothing to a filename
    .slice(0, 5)
    .join('-');
  return [who, 'Resume', target].filter(Boolean).join('-');
}
function filenameOf(v){
  return (v.autoName === false && v.filename) ? v.filename : autoFilename(v);
}
function menuLabel(v){
  const t = (v.roleTitle || '').trim(), e = (v.employer || '').trim();
  if(t || e) return [t, e].filter(Boolean).join(' — ');
  return (v.note || '').trim() || v.name || 'Untitled';
}

// Group print order is per-variant; falls back to library order.
function orderedGroups(v){
  if(!Array.isArray(v.groupOrder)) v.groupOrder = [];
  v.groupOrder = v.groupOrder.filter(id => data.skillGroups.some(g => g.id === id));
  data.skillGroups.forEach(g => { if(!v.groupOrder.includes(g.id)) v.groupOrder.push(g.id); });
  return v.groupOrder.map(id => data.skillGroups.find(g => g.id === id)).filter(Boolean);
}

const addStyle = v => (v.addStyle === 'list' ? 'list' : 'compact');

function skillVer(v, iid){
  if(!v.skillVers) v.skillVers = {};
  return v.skillVers[iid] || 0;
}
function setSkillVer(v, iid, n){
  if(!v.skillVers) v.skillVers = {};
  v.skillVers[iid] = n;
}

function skillSel(v, group){
  if(!v.skillItems) v.skillItems = {};
  if(!v.skillItems[group.id]) v.skillItems[group.id] = group.items.map(i=>i.id);
  v.skillItems[group.id] = v.skillItems[group.id].filter(id => group.items.some(i => i.id === id));
  return v.skillItems[group.id];
}
const active = () => data.variants.find(v => v.id === data.activeId) || data.variants[0];
const bulletById = id => data.bullets.find(b => b.id === id);
const roleById = id => data.roles.find(r => r.id === id);
const catById = id => data.categories.find(c => c.id === id);

// Which jobs may this bullet sit under? Categories give the base set; per-bullet
// add/exclude lists override it in both directions.
function eligible(b){
  const set = new Set();
  (b.cats || []).forEach(cid => { const c = catById(cid); if(c) (c.roles || []).forEach(r => set.add(r)); });
  (b.add || []).forEach(r => set.add(r));
  (b.ex || []).forEach(r => set.delete(r));
  return data.roles.filter(r => set.has(r.id)).map(r => r.id);
}
const isEligible = (b, rid) => eligible(b).includes(rid);

// Blank-line separated paragraphs are alternate versions of the same claim.
function versionsOf(b){
  const parts = String(b.text || '').split(/\n\s*\n+/).map(t => t.trim()).filter(Boolean);
  return parts.length ? parts : [''];
}
function versionText(b, n){
  const vs = versionsOf(b);
  return vs[Math.min(Math.max(0, n || 0), vs.length - 1)];
}

function placeOf(v, bid){
  if(!v.place) v.place = {};
  return v.place[bid] || null;
}
function orderIn(v, zone){
  if(!v.order) v.order = {};
  if(!Array.isArray(v.order[zone])) v.order[zone] = [];
  // keep in sync with actual placements
  v.order[zone] = v.order[zone].filter(id => {
    const p = placeOf(v, id);
    return p && p.at === zone && bulletById(id);
  });
  data.bullets.forEach(b => {
    const p = placeOf(v, b.id);
    if(p && p.at === zone && !v.order[zone].includes(b.id)) v.order[zone].push(b.id);
  });
  return v.order[zone];
}
function setPlace(v, bid, zone){
  if(!v.place) v.place = {};
  if(!v.order) v.order = {};
  const prev = placeOf(v, bid);
  if(prev && v.order[prev.at]) v.order[prev.at] = v.order[prev.at].filter(x => x !== bid);
  if(zone === null){ delete v.place[bid]; return; }
  v.place[bid] = { at: zone, ver: prev ? prev.ver : 0 };
  if(!Array.isArray(v.order[zone])) v.order[zone] = [];
  if(!v.order[zone].includes(bid)) v.order[zone].push(bid);
}

function rset(v, role){
  if(!v.roles[role.id]) v.roles[role.id] = { place: role.sectionId || SEC_MAIN, title:'' };
  const rs = v.roles[role.id];
  if(rs.place === undefined) rs.place = role.sectionId || SEC_MAIN;
  if(rs.place !== 'off' && !data.sections.some(s => s.id === rs.place)) rs.place = 'off';
  return rs;
}
const sectionOf = id => data.sections.find(s => s.id === id);

/* ---------------- storage ---------------- */
let saveTimer, retryTimer, retryDelay = 1000, storageOk = true, unsaved = false;
let saving = false, lastSaved = null, mode = 'probing', lastError = '';
let lastSavedAt = null;
setInterval(() => { try { updateSaveState(); } catch(_){} }, 15000);
setInterval(async () => {
  if(mode === 'memory'){
    await probeStorage();
    if(mode !== 'memory'){ setStorageState(true); attemptSave(); }
  }
}, 30000);

// Only one real backend exists here: window.storage. localStorage is not available
// in this environment, so there is no second tier — the fallback is "hold it in memory
// and tell the user to export". Requests are rate limited, so we make as few as possible.
// Two possible stores. We never pre-test them — we attempt the real operation and
// see what happens, because feature detection lies in sandboxed frames.
// This environment gives localStorage a very small quota, so everything is stored
// compressed. LZW over UTF-16 typically gets JSON down to about a quarter of its size.
const LZ_TAG = 'LZW1:';
// LZW assumes an 8-bit alphabet, so encode to UTF-8 bytes first; otherwise any
// character above 255 collides with a dictionary code and corrupts the data.
const toBytes = s => unescape(encodeURIComponent(s));
const fromBytes = s => decodeURIComponent(escape(s));

function lzCompress(input){
  const str = toBytes(input);
  const dict = new Map();
  let out = [], phrase = str[0] || '', code = 256, c;
  for(let i = 1; i < str.length; i++){
    c = str[i];
    if(dict.has(phrase + c)) phrase += c;
    else {
      out.push(phrase.length > 1 ? dict.get(phrase) : phrase.charCodeAt(0));
      dict.set(phrase + c, code++);
      phrase = c;
      if(code >= 65530){ dict.clear(); code = 256; }   // keep codes inside one UTF-16 unit
    }
  }
  if(phrase !== '') out.push(phrase.length > 1 ? dict.get(phrase) : phrase.charCodeAt(0));
  let res = LZ_TAG;
  for(let i = 0; i < out.length; i++) res += String.fromCharCode(out[i]);
  return res;
}
function lzDecompress(packed){
  if(typeof packed !== 'string' || packed.indexOf(LZ_TAG) !== 0) return packed;
  const body = packed.slice(LZ_TAG.length);
  if(!body) return '';
  const dict = {};
  let code = 256, prev = body[0], out = prev, phrase;
  for(let i = 1; i < body.length; i++){
    const cur = body.charCodeAt(i);
    if(cur < 256) phrase = body[i];
    else phrase = dict[cur] ? dict[cur] : (prev + prev[0]);
    out += phrase;
    dict[code++] = prev + phrase[0];
    if(code >= 65530){ for(const k in dict) delete dict[k]; code = 256; }
    prev = phrase;
  }
  try { return fromBytes(out); } catch(e){ return out; }
}

const backends = {
  cloud: {
    label: 'synced storage',
    async set(val, k){
      if(!window.storage || typeof window.storage.set !== 'function') throw new Error('window.storage absent');
      await window.storage.set(k || KEY, val);
    },
    async get(k){
      if(!window.storage || typeof window.storage.get !== 'function') return null;
      try { const r = await window.storage.get(k || KEY); return (r && r.value) ? lzDecompress(r.value) : null; }
      catch(e){ return null; }                       // a missing key throws here
    },
  },
  local: {
    label: 'this browser',
    async set(val, k){
      const key = k || KEY;
      const packed = lzCompress(val);
      try { window.localStorage.removeItem(key); } catch(e){}   // free the old value first
      try { window.localStorage.setItem(key, packed); }
      catch(e){
        // Out of room: shed everything else this app owns, then try once more.
        dropSnapshots();
        window.localStorage.setItem(key, packed);
      }
    },
    async get(k){
      try { return lzDecompress(window.localStorage.getItem(k || KEY)); } catch(e){ return null; }
    },
  },
  memory: {
    label: 'not saving',
    async set(){ throw new Error('No storage available in this session'); },
    async get(){ return null; },
  },
};

// Try a real write to each store in turn. Whichever accepts it becomes the mode.
async function probeStorage(){
  const probeVal = '1';
  for(const name of ['cloud', 'local']){
    try {
      await backends[name].set(probeVal, KEY + '::probe');
      try {
        if(name === 'local') window.localStorage.removeItem(KEY + '::probe');
        else if(window.storage && window.storage.delete) await window.storage.delete(KEY + '::probe');
      } catch(_){}
      mode = name;
      lastError = '';
      return;
    } catch(e){
      lastError = `${name}: ${(e && e.message) || e}`;
    }
  }
  // Nothing accepted a probe. Stay optimistic — writeNow tries every store on
  // each attempt, and the retry loop will pick things up when they recover.
  mode = 'local';
}

const SNAP_KEY = KEY + '-snapshot';
async function snapshot(force){
  if(mode === 'memory') return;
  const last = (data && data.snapAt) || 0;
  if(!force && Date.now() - last < 3600000) return;
  try {
    data.snapAt = Date.now();
    await backends[mode].set(JSON.stringify({ at: new Date().toISOString(), data }), SNAP_KEY);
  } catch(e){ /* best-effort */ }
}

const QUOTA_RE = /quota|exceed|full|storage is full|NS_ERROR_DOM_QUOTA/i;
const isQuota = e => !!e && (QUOTA_RE.test(e.message || '') || e.name === 'QuotaExceededError' || e.code === 22);

// When a store fills up, the snapshot is the first thing worth sacrificing.
function dropSnapshots(){
  let n = 0;
  try {
    const ls = window.localStorage;
    for(let i = ls.length - 1; i >= 0; i--){
      const k = ls.key(i);
      if(k && k.indexOf(KEY) === 0 && k !== KEY){ ls.removeItem(k); n++; }
    }
  } catch(e){}
  try { if(window.storage && window.storage.delete) window.storage.delete(SNAP_KEY); } catch(e){}
  return n;
}

function pruneOldSnapshots(){ return dropSnapshots(); }

function relTime(ms){
  const s = Math.round((Date.now() - ms) / 1000);
  if(s < 5) return 'just now';
  if(s < 60) return s + 's ago';
  const m = Math.round(s / 60);
  if(m < 60) return m + ' min ago';
  const h = Math.round(m / 60);
  if(h < 24) return h + 'h ago';
  return Math.round(h / 24) + 'd ago';
}

function daysSinceBackup(){
  if(!data || !data.lastBackup) return Infinity;
  return (Date.now() - data.lastBackup) / 86400000;
}

function updateSaveState(){
  const el = document.getElementById('saveState');
  if(!el || !data) return;
  const sinceSave = data.editsSinceSave || 0;
  const sinceBackup = data.editsSinceBackup || 0;
  let saveTxt, warn = false;
  if(mode === 'memory'){ saveTxt = 'Not saving'; warn = true; }
  else if(!storageOk){
    saveTxt = 'Retrying save' + (lastSavedAt ? ` · last saved ${relTime(lastSavedAt)}` : '');
    warn = true;
  }
  else if(unsaved){ saveTxt = 'Saving…'; }
  else if(lastSavedAt){
    const where = mode === 'local' ? ' (this browser)' : '';
    saveTxt = 'Saved ' + relTime(lastSavedAt) + where + (sinceSave ? ` · ${sinceSave} edit${sinceSave===1?'':'s'}` : '');
  }
  else saveTxt = 'Not saved yet';

  const bk = data.lastBackup
    ? `Backed up ${relTime(data.lastBackup)}` + (sinceBackup ? ` · ${sinceBackup} since` : '')
    : 'Never backed up';
  const stale = !data.lastBackup || sinceBackup > 40 || daysSinceBackup() > 3;

  el.innerHTML = `<span class="ss-save${warn?' warn':''}">${esc(saveTxt)}</span>` +
                 `<span class="ss-sep">·</span>` +
                 `<span class="ss-backup${stale?' warn':''}">${esc(bk)}</span>`;
}

function updateBackupBar(){
  const bar = document.getElementById('backupBar');
  if(!bar || !data) return;
  const d = daysSinceBackup();
  const edits = data.editsSinceBackup || 0;
  const stale = (d > 3 || edits > 40) && !ui.snoozeBackup;
  bar.hidden = !stale;
  if(stale){
    document.getElementById('backupText').innerHTML = d === Infinity
      ? '<strong>Never backed up.</strong> Browser storage is not durable — export a file and keep it somewhere that syncs.'
      : `<strong>Last backup ${Math.floor(d)} days ago${edits ? `, ${edits} edits since` : ''}.</strong> Export a fresh file so a lost session can\'t cost you work.`;
  }
}

function updateBar(){
  const bar = document.getElementById('storageBar');
  const ok = mode !== 'memory' && storageOk;
  bar.hidden = ok;
  if(!ok && lastFailure){
    document.getElementById('barText').innerHTML =
      `<strong>Storage is refusing writes — retrying.</strong> ` +
      `Your work is safe on this page and a backup file was downloaded. ` +
      `<span style="opacity:.8">${esc(String(lastFailure.errs[0] || '')).slice(0,140)}</span>`;
    return;
  }
  if(!ok){
    const dead = mode === 'memory';
    document.getElementById('barText').innerHTML = dead
      ? `<strong>Storage unavailable in this browser session.</strong> Nothing will be saved when you close the tab — ` +
        `use <strong>Back up now</strong> and restore the file next time.` +
        (lastError ? ` <span style="opacity:.7">(${esc(lastError).slice(0,90)})</span>` : '')
      : `<strong>Save failed — retrying.</strong> Your work is safe on this page. Back up to a file if you need to close it.` +
        (lastError ? ` <span style="opacity:.7">(${esc(lastError).slice(0,90)})</span>` : '');
  }
}
function setStorageState(ok){
  storageOk = ok;
  updateBar();
  try { updateSaveState(); } catch(_){}
}

// Everything about a failure, captured the moment it happens.
let lastFailure = null;

function payloadOf(){
  // Compare without the timestamp so an unchanged document is not rewritten.
  const stamp = data.savedAt;
  data.savedAt = 0;
  const body = JSON.stringify(data);
  data.savedAt = stamp;
  if(body === lastBody) return null;
  pendingBody = body;
  data.savedAt = Date.now();
  return JSON.stringify(data);
}
let lastBody = null, pendingBody = null;

// A payload the store will almost certainly accept: everything except the bulk
// that can be re-created (pasted postings). Used only when the full write fails.
function slimPayload(){
  const slim = JSON.parse(JSON.stringify(data));
  slim.variants.forEach(v => { v.posting = ''; });
  slim.__slim = true;
  return JSON.stringify(slim);
}

async function tryWrite(name, payload){
  await backends[name].set(payload);
  const back = await backends[name].get();
  if(back == null) throw new Error('write reported success but read back empty');
  return true;
}

async function writeNow(){
  const payload = payloadOf();
  if(payload === null){ unsaved = false; setStorageState(true); return; }
  const kb = payload.length / 1024;
  const errs = [];

  // 1. Normal path: try each store with the full payload.
  for(const name of [mode, 'cloud', 'local']){
    if(!backends[name] || name === 'memory') continue;
    try { await tryWrite(name, payload); mode = name; return finishWrite(payload, kb); }
    catch(e){ errs.push(`${name}: ${(e && e.name) || ''} ${(e && e.message) || e}`); }
  }

  // 2. Something refused it. Shed the snapshot and retry once.
  if(dropSnapshots()){
    for(const name of ['cloud', 'local']){
      try { await tryWrite(name, payload); mode = name; return finishWrite(payload, kb); }
      catch(e){ errs.push(`${name} (after prune): ${(e && e.message) || e}`); }
    }
  }

  // 3. Still refused. Write a slim copy so the session is never lost, and say so.
  const slim = slimPayload();
  for(const name of ['cloud', 'local']){
    try {
      await tryWrite(name, slim);
      mode = name;
      lastFailure = { kb, slimKb: slim.length / 1024, errs, at: Date.now(), degraded: true };
      unsaved = false;
      lastSavedAt = Date.now();
      data.editsSinceSave = 0;
      setStorageState(true);
      flashHistory('Saved without posting text — storage refused the full copy');
      return;
    } catch(e){ errs.push(`${name} (slim): ${(e && e.message) || e}`); }
  }

  // 4. Nothing worked this time. Get the data off the page, then keep trying:
  //    rate limits and transient server errors both clear on their own.
  lastFailure = { kb, errs, at: Date.now(), degraded: false };
  emergencyBackup();
  throw new Error(`Could not save ${kb.toFixed(0)} KB just now — ${errs[0] || 'unknown error'}`);
}

function finishWrite(payload, kb){
  lastSaved = payload;
  lastBody = pendingBody;
  unsaved = false;
  lastSavedAt = Date.now();
  data.editsSinceSave = 0;
  retryDelay = 1000;
  lastFailure = null;
  clearTimeout(retryTimer);
  setStorageState(true);
  if(kb < 3000){
    const other = mode === 'cloud' ? 'local' : 'cloud';
    backends[other].set(payload).catch(() => {});
  }
  try { maybeAutoBackup(); } catch(e){}
}

// If storage is genuinely gone, at least put the file on disk — once per session
// per failure streak, so it cannot spam downloads.
let emergencyDone = 0;
function emergencyBackup(){
  if(Date.now() - emergencyDone < 120000) return;
  emergencyDone = Date.now();
  try {
    downloadBackup('EMERGENCY');
    flashHistory('Storage failed — a backup file was downloaded');
  } catch(e){}
}

let pendingSave = false;
async function attemptSave(){
  if(mode === 'memory'){ await probeStorage(); }
  if(mode === 'probing'){ pendingSave = true; return; }
  if(saving){ pendingSave = true; return; }      // re-run once the current write finishes
  saving = true;
  try { await writeNow(); }
  catch(e){
    lastError = (e && e.message) || String(e);
    console.warn('Save failed, will retry', e);
    // writeNow already tried every store before throwing.
    setStorageState(false);
    clearTimeout(retryTimer);
    retryTimer = setTimeout(attemptSave, retryDelay);
    retryDelay = Math.min(Math.round(retryDelay * 1.6), 15000);
  }
  finally {
    saving = false;
    if(pendingSave){ pendingSave = false; setTimeout(attemptSave, 0); }   // flush what arrived mid-write
  }
}

let lastEditAt = 0;
function save(){
  unsaved = true;
  if(data){
    const now = Date.now();
    // One "edit" = one discrete action or one burst of typing, not one keystroke.
    if(now - lastEditAt > 900){
      data.editsSinceBackup = (data.editsSinceBackup || 0) + 1;
      data.editsSinceSave = (data.editsSinceSave || 0) + 1;
    }
    lastEditAt = now;
  }
  pushHistory();
  updateSaveState();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { attemptSave().then(updateSaveState); }, 2500);
}

async function load(){
  // Read first — a store that can be read from is worth keeping even if a
  // write probe later fails, because the data in it is real.
  const found = [];
  for(const name of ['cloud', 'local']){
    try {
      const val = await backends[name].get();
      if(!val) continue;
      const parsed = JSON.parse(val);
      found.push({ name, val, parsed, at: parsed.savedAt || 0 });
    } catch(e){ console.info('read failed on', name, (e && e.message) || e); }
  }
  await probeStorage();
  if(!found.length){ console.info('No saved data found in either store'); return null; }
  found.sort((a, b) => b.at - a.at);
  const best = found[0];
  lastSaved = best.val;
  if(mode === 'memory') mode = best.name;  // readable but write-probe failed: still try
  console.info('Loaded from', best.name, '·', (best.val.length/1024).toFixed(1), 'KB');
  return best.parsed;
}

document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden' && unsaved){ clearTimeout(saveTimer); attemptSave(); }
});
// Last-ditch synchronous write to localStorage; async storage cannot finish during unload.
window.addEventListener('pagehide', () => {
  if(!unsaved) return;
  try { window.localStorage.setItem(KEY, JSON.stringify(data)); } catch(_){}
});
window.addEventListener('blur', () => { if(unsaved){ clearTimeout(saveTimer); attemptSave(); } });

window.addEventListener('beforeunload', e => {
  if(unsaved){ e.preventDefault(); e.returnValue = ''; }
});

function syncSummary(v){
  const text = (v.summary || '').trim();
  if(!Array.isArray(data.summaries)) data.summaries = [];
  const i = data.summaries.findIndex(x => x.from === v.id);
  if(!text){ if(i > -1) data.summaries.splice(i, 1); return; }
  if(i < 0 && (v.summaryArchivedOff || '') === text) return;   // user deleted this one
  const rec = {
    id: i > -1 ? data.summaries[i].id : uid('sum'),
    from: v.id, text,
    title: (v.roleTitle || '').trim(),
    employer: (v.employer || '').trim(),
    at: (i > -1 ? data.summaries[i].at : null) || new Date().toLocaleDateString(),
  };
  if(i > -1) data.summaries[i] = rec; else data.summaries.unshift(rec);
}

function slider(key, label, val, range, step, unit, note){
  const [min, max] = range;
  const conv = BOUNDS_CONV[key];
  const outside = val < conv[0] - 1e-9 || val > conv[1] + 1e-9;
  const ideal = IDEAL[key];
  const pct = ideal !== undefined && max > min ? ((ideal - min) / (max - min)) * 100 : null;
  const atIdeal = ideal !== undefined && Math.abs(val - ideal) < 1e-9;
  return `<label class="field" style="margin-bottom:16px">
    <span>${label}
      <b data-unit="${unit}" style="float:right;font-family:var(--mono);color:${outside?'var(--warn)':'var(--ink-2)'};font-weight:500">${val}${unit}${outside?' ⚠':''}${atIdeal?' ◆':''}</b></span>
    <span class="slidewrap">
      ${max > conv[1] || min < conv[0] ? `<i class="band" style="left:0;width:${Math.max(0,((conv[0]-min)/(max-min))*100)}%"></i>
        <i class="band ok" style="left:${((conv[0]-min)/(max-min))*100}%;width:${((conv[1]-conv[0])/(max-min))*100}%"></i>
        <i class="band" style="left:${((conv[1]-min)/(max-min))*100}%;right:0"></i>` : ''}
      ${pct !== null && pct >= 0 && pct <= 100 ? `<i class="idealmark" style="left:${pct}%" title="Typical: ${ideal}${unit}"></i>` : ''}
      <input type="range" min="${min}" max="${max}" step="${step}" value="${val}" data-slider="${key}" style="padding:0">
    </span>
    ${note ? `<span style="text-transform:none;letter-spacing:0;font-family:var(--ui);font-size:11.5px">${note}</span>` : ''}
  </label>`;
}

// Bullets actually printing right now: placed under a job that sits in a
// section rendered in full. Shelf, backburner and staging do not count.
function printingBulletIds(){
  const v = active();
  const out = new Set();
  if(!v) return out;
  data.sections.forEach(sec => {
    const style = sec.id === SEC_ADD ? addStyle(v) : 'full';
    if(style !== 'full') return;
    data.roles.filter(r => rset(v, r).place === sec.id).forEach(r => {
      orderIn(v, r.id).forEach(id => out.add(id));
    });
  });
  return out;
}

function matchesFilter(b, q){
  if(String(b.text || '').toLowerCase().includes(q)) return true;
  if((b.cats || []).some(cid => {
    const c = catById(cid);
    return c && (c.label || '').toLowerCase().includes(q);
  })) return true;
  return eligible(b).some(rid => {
    const r = roleById(rid);
    return r && ((r.company || '') + ' ' + (r.title || '')).toLowerCase().includes(q);
  });
}

// Remove a bullet from the library and from every variant that referenced it.
function deleteBullet(bid){
  data.bullets = data.bullets.filter(b => b.id !== bid);
  data.variants.forEach(v => {
    if(v.place) delete v.place[bid];
    if(v.keep) delete v.keep[bid];
    Object.keys(v.order || {}).forEach(z => {
      v.order[z] = (v.order[z] || []).filter(x => x !== bid);
    });
  });
}

const DRAFT_LEVELS = [
  { key: 0, label: 'Captured',  hint: 'Raw from the posting — say what they want in their words.' },
  { key: 1, label: 'Reworked',  hint: 'Rewritten as something you actually did.' },
  { key: 2, label: 'Ready',     hint: 'Resume language. Promote into the library when it earns a place.' },
];

function draftsOf(v){
  if(!Array.isArray(v.drafts)) v.drafts = [];
  v.drafts.forEach(d => { if(typeof d.level !== 'number') d.level = 0; });
  return v.drafts;
}
function draftsAt(v, level){ return draftsOf(v).filter(d => d.level === level); }

// One row for a real bullet sitting in a non-printing band on the page.
// ---- selection (the inspector pattern: canvas selects, panel inspects) ----
// Which other variants show this exact bullet version right now?
// Anything not yet signed off shows a soft highlight so unfinished work is obvious.
function doneKey(kind, id){ return kind + '|' + id; }

// Two separate decisions per item: is it staying, and is the wording final.
// One decision per item: have I looked at it and decided to keep it?
// Three states: untouched, kept (still working), and done.
function itemState(v, kind, id){
  const rec = (v.done && v.done[doneKey(kind, id)]) || null;
  if(rec === true) return { kept: true, worded: true };      // legacy boolean
  return { kept: !!(rec && rec.kept), worded: !!(rec && rec.worded) };
}
function setItemState(v, kind, id, patch){
  if(!v.done) v.done = {};
  const k = doneKey(kind, id);
  const cur = itemState(v, kind, id);
  const next = { ...cur, ...patch };
  if(!next.kept && !next.worded) delete v.done[k];
  else v.done[k] = next;
}
function isDone(v, kind, id){ return itemState(v, kind, id).kept; }
function toggleDone(v, kind, id){
  setItemState(v, kind, id, { kept: !itemState(v, kind, id).kept });
}
function todoCount(v){
  let total = 0, done = 0;
  const tally = (kind, id) => { total++; if(itemState(v, kind, id).kept) done++; };
  data.sections.forEach(sec => {
    const style = sec.id === SEC_ADD ? addStyle(v) : 'full';
    data.roles.filter(r => rset(v, r).place === sec.id).forEach(r => {
      tally('role', r.id);
      if(style === 'full') orderIn(v, r.id).forEach(id => tally('bullet', id));
    });
  });
  if(v.showSummary && (v.summary || '').trim()) tally('summary', '_');
  orderedGroups(v).filter(g => v.skillsOn[g.id] !== false).forEach(g => {
    tally('skillgroup', g.id);
    skillSel(v, g).forEach(id => tally('skill', id));
  });
  data.education.filter(e => v.eduOn[e.id] !== false).forEach(e => tally('edu', e.id));
  // section headings are structural and never tallied
  return { total, done, left: total - done, undecided: total - done, unworded: 0 };
}

function versionUsers(bulletId, verIdx, exceptVariantId){
  return data.variants.filter(v => {
    if(v.id === exceptVariantId) return false;
    const p = (v.place || {})[bulletId];
    return p && (p.ver || 0) === verIdx && p.at !== 'backburner';
  });
}
function variantLabel(v){
  return (v.roleTitle || '').trim() || (v.note || '').trim() || v.name || 'Untitled';
}

// Editing is allowed freely until the moment a key is pressed. At that point, if
// the wording is shared with another variant, the choice is offered.
let sharedPending = null;

function editAuthorised(bulletId, verIdx){
  return ui.editOkFor === bulletId + '|' + verIdx;
}
function authoriseEdit(bulletId, verIdx){
  ui.editOkFor = bulletId + '|' + verIdx;
}

// True when the caller may proceed without asking.
function editNeedsAsk(bulletId, verIdx){
  if(editAuthorised(bulletId, verIdx)) return false;
  return versionUsers(bulletId, verIdx, active().id).length > 0;
}

function openSharedModal(bulletId, verIdx, resumeFocus){
  const users = versionUsers(bulletId, verIdx, active().id);
  sharedPending = { bulletId, verIdx, resumeFocus };
  document.getElementById('sharedTitle').textContent = 'This wording is used elsewhere';
  document.getElementById('sharedBody').innerHTML =
    `It appears on ${users.length} other resume${users.length === 1 ? '' : 's'}:` +
    `<ul>${users.slice(0, 6).map(u => `<li>${esc(variantLabel(u))}</li>`).join('')}</ul>` +
    `<p style="margin:10px 0 0">Editing the shared text changes all of them. ` +
    `Creating a new version leaves them untouched.</p>`;
  document.getElementById('sharedModal').hidden = false;
  document.getElementById('sharedNew').focus();
}

function closeSharedModal(){
  document.getElementById('sharedModal').hidden = true;
  sharedPending = null;
}

function refocusEditor(bulletId){
  requestAnimationFrame(() => {
    const ta = docEl.querySelector(`textarea[data-doctext="${bulletId}"], textarea[data-bandtext="${bulletId}"]`)
      || document.querySelector(`textarea[data-btext="${bulletId}"], textarea[data-vertext^="${bulletId}|"]`);
    if(ta && ta.focus){ ta.focus(); autoGrow(ta); ta.setSelectionRange(ta.value.length, ta.value.length); }
  });
}

document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && !document.getElementById('sharedModal').hidden){
    e.preventDefault();
    closeSharedModal();
    flashHistory('Left unchanged');
  }
});

document.getElementById('sharedCancel').onclick = () => {
  closeSharedModal();
  flashHistory('Left unchanged');
};
document.getElementById('sharedShared').onclick = () => {
  const p = sharedPending;
  closeSharedModal();
  if(!p) return;
  authoriseEdit(p.bulletId, p.verIdx);
  flashHistory('Editing the shared wording');
  refocusEditor(p.bulletId);
};
document.getElementById('sharedNew').onclick = () => {
  const p = sharedPending;
  closeSharedModal();
  if(!p) return;
  const v = active();
  const b = bulletById(p.bulletId);
  const idx = addVersion(b, versionText(b, p.verIdx));
  const pl = placeOf(v, p.bulletId);
  if(pl) pl.ver = idx;
  authoriseEdit(p.bulletId, idx);
  save(); render();
  flashHistory('New version created — other resumes untouched');
  refocusEditor(p.bulletId);
};

const STRUCTURAL = new Set(['section', 'edusection', 'skillsection']);

function itemCls(kind, id, extra){
  const v = active();
  const cls = [];
  if(ui.sel && ui.sel.kind === kind && ui.sel.id === id) cls.push('is-sel');
  if(v && ui.showTodo !== false && !STRUCTURAL.has(kind)){
    const st = itemState(v, kind, id);
    // Pink = untouched, yellow = keeping it, no colour once it is done.
    if(!st.worded) cls.push(st.kept ? 'is-kept' : 'not-seen');
  }
  if(extra) cls.push(extra);
  return cls.length ? ` class="${cls.join(' ')}"` : '';
}

const selCls = (kind, id) => itemCls(kind, id);

function selectItem(kind, id){
  ui.sel = { kind, id };
  ui.tab = 'inspect';
  render();
}
function clearSelection(){ ui.sel = null; if(ui.tab === 'inspect') ui.tab = 'variant'; render(); }

// Replace one version inside a bullet's blank-line-separated text.
function setVersionText(b, idx, text){
  const vs = versionsOf(b);
  vs[Math.min(Math.max(0, idx), vs.length - 1)] = text;
  b.text = vs.join('\n\n');
}
function addVersion(b, text){
  b.text = String(b.text || '').trim() + '\n\n' + (text || 'New version');
  return versionsOf(b).length - 1;
}
function removeVersion(b, idx){
  const vs = versionsOf(b);
  if(vs.length < 2) return false;
  vs.splice(idx, 1);
  b.text = vs.join('\n\n');
  return true;
}

function inspectorHTML(){
  const v = active();
  if(!ui.sel) return `<div class="empty">Click anything on the resume to edit it here.</div>`;
  if(ui.sel.kind === 'bullet')  return inspectBullet(v, ui.sel.id);
  if(ui.sel.kind === 'skill'){
    let gid = null;
    data.skillGroups.forEach(g => g.items.forEach(i => { if(i.id === ui.sel.id) gid = g.id; }));
    return gid ? inspectSkillGroup(v, gid, ui.sel.id) : `<div class="empty">That skill no longer exists.</div>`;
  }
  if(ui.sel.kind === 'skillgroup')   return inspectSkillGroup(v, ui.sel.id, null);
  if(ui.sel.kind === 'section')      return inspectSection(v, ui.sel.id);
  if(ui.sel.kind === 'edusection')   return inspectEduSection(v);
  if(ui.sel.kind === 'skillsection') return inspectSkillSection(v);
  if(ui.sel.kind === 'role')    return inspectRole(v, ui.sel.id);
  if(ui.sel.kind === 'edu')     return inspectEdu(v, ui.sel.id);
  if(ui.sel.kind === 'summary') return inspectSummary(v);
  if(ui.sel.kind === 'header')  return inspectHeader();
  return `<div class="empty">Nothing to inspect.</div>`;
}

  </div>`;

// Reorder within the section the job actually prints in, skipping jobs that sit
// elsewhere — otherwise an arrow can appear to do nothing.
function moveRoleWithinSection(id, dir){
  const v = active();
  const me = roleById(id);
  if(!me) return;
  const place = rset(v, me).place;
  const peers = data.roles.filter(r => rset(v, r).place === place);
  const gi = peers.findIndex(r => r.id === id);
  const target = peers[gi + dir];
  if(!target) return;
  const a = data.roles.findIndex(r => r.id === id);
  const b = data.roles.findIndex(r => r.id === target.id);
  const [moved] = data.roles.splice(a, 1);
  data.roles.splice(b, 0, moved);
}

function inspectSkillGroup(v, gid, focusItem){
  const g = data.skillGroups.find(x => x.id === gid);
  if(!g) return `<div class="empty">That group no longer exists.</div>`;
  const sel = skillSel(v, g);
  const on = v.skillsOn[g.id] !== false;

  const row = (i, included) => {
    const vs = versionsOf(i);
    const cur = skillVer(v, i.id);
    const focused = focusItem === i.id;
    const stI = itemState(v, 'skill', i.id);

        <span style="flex:1"></span>
        ${vs.length > 1 ? `<span class="band-ver">
          <button class="arrow" data-usesver="${i.id}|${Math.max(0,cur-1)}" ${cur<=0?'disabled':''}>‹</button>
          <span class="verno">v${cur+1}/${vs.length}</span>
          <button class="arrow" data-usesver="${i.id}|${Math.min(vs.length-1,cur+1)}" ${cur>=vs.length-1?'disabled':''}>›</button>
        </span>` : ''}
        ${included ? `<button class="arrow" data-smove="${g.id}|${i.id}|-1">▲</button>
                      <button class="arrow" data-smove="${g.id}|${i.id}|1">▼</button>` : ''}

// A printed bullet: click selects, click again edits, and version arrows sit inline.
// Small inline controls that appear on whichever item is selected.
// Two ticks: keeping it, and the wording is final.
// Red / yellow / green, matching the highlight the item will carry.
function stateCtl(v, kind, id){
  const st = itemState(v, kind, id);
  const asideAction = {
    bullet: `data-bandto="${id}|backburner"`,
    role: `data-place="${id}|off"`,
    skill: `data-skillaside="${id}"`,
    skillgroup: `data-groupaside="${id}"`,
    edu: `data-eduaside="${id}"`,
  }[kind] || `data-setstate="${kind}|${id}|reset"`;
  return `<span class="tri">
    <button class="tri-b red" ${asideAction} title="Set aside">●</button>
    <button class="tri-b yel${st.kept && !st.worded ? ' on' : ''}" data-setstate="${kind}|${id}|kept" title="Keep — still working on it">●</button>
    <button class="tri-b grn${st.worded ? ' on' : ''}" data-setstate="${kind}|${id}|done" title="Done — stop highlighting it">●</button>
  </span>`;
}

function roleCtl(v, r){
  if(!(ui.sel && ui.sel.kind === 'role' && ui.sel.id === r.id)) return '';

    <button class="ictl" data-place="${r.id}|${SEC_MAIN}" ${rs.place===SEC_MAIN?'disabled':''}>Exp</button>
    <button class="ictl" data-place="${r.id}|${SEC_ADD}" ${rs.place===SEC_ADD?'disabled':''}>Add'l</button>
    <button class="ictl" data-place="${r.id}|off" title="Set aside">⌄</button>

}

function findDraft(v, id){ return draftsOf(v).find(d => d.id === id); }

// Promote a finished draft into the shared library as a brand-new bullet.
function draftToBullet(v, id){
  const d = findDraft(v, id);
  if(!d || !String(d.text || '').trim()) return null;
  const nb = { id: uid('b'), text: d.text.trim(), tags: [], cats: [], add: [], ex: [] };
  data.bullets.push(nb);
  setPlace(v, nb.id, 'shelf');            // lands on the shelf, ready to be placed
  v.drafts = draftsOf(v).filter(x => x.id !== id);
  return nb;
}

// Or fold it onto an existing bullet as an alternate version.
function draftIntoVersion(v, id, bulletId){
  const d = findDraft(v, id), b = bulletById(bulletId);
  if(!d || !b) return null;
  b.text = String(b.text || '').trim() + '\n\n' + String(d.text || '').trim();
  v.drafts = draftsOf(v).filter(x => x.id !== id);
  if(!placeOf(v, bulletId)) setPlace(v, bulletId, 'shelf');
  return b;
}

function eduKind(e){ return e.kind === 'credential' ? 'credential' : 'education'; }

// Credentials have no location; everything else is shared.
function eduFieldSet(e, cred){
  return cred ? [
    ['school','Issuing body'], ['degree','Credential name'], ['detail','Endorsement / area'],
    ['startDate','Issued'], ['dates','Expires'], ['license','License number'], ['status','Status'],
  ] : [
    ['school','School'], ['degree','Degree'], ['location','Location'], ['detail','Honors or detail'],
    ['startDate','Start'], ['dates','Graduated'], ['license','GPA (optional)'], ['status','Minor or concentration'],
  ];
}

// Sensible defaults: credentials print just the name and endorsement.
const EDU_PRINT_DEFAULT = {
  credential: { degree:true, detail:true, school:false, startDate:false, dates:false, license:false, status:false },
  education:  { school:true, degree:true, location:true, detail:true, dates:true, startDate:true, license:false, status:false },
};
function eduPrints(e, key){
  if(e.print && Object.prototype.hasOwnProperty.call(e.print, key)) return !!e.print[key];
  return !!EDU_PRINT_DEFAULT[eduKind(e)][key];
}
function eduSetPrint(e, key, on){
  if(!e.print) e.print = {};
  e.print[key] = on;
}

function eduField(e, key, label){
  const val = String(e[key] || '').trim();
  return `<div class="field appfield" style="margin:0">
    <button class="fieldlabel" data-educopyfield="${e.id}|${key}" title="Click to copy">
