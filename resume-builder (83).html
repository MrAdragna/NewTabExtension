// What the right-hand date column shows on the page.
function eduDates(e){
  const a = eduPrints(e, 'startDate') ? String(e.startDate || '').trim() : '';
  const b = eduPrints(e, 'dates') ? String(e.dates || '').trim() : '';
  if(e.showRange && a && b) return a + ' – ' + b;
  return b || a;
}
// Two-column rows: the main label on the left, its partner right-justified —
// the same shape the job entries use, so Education matches Experience.
function eduRows(e){
  const cred = eduKind(e) === 'credential';
  const F = k => (eduPrints(e, k) ? String(e[k] || '').trim() : '');
  const rows = [], txt = [];
  const push = (left, right, bold) => {
    if(!left && !right) return;
    rows.push(`<div class="job-b"><span${bold ? ' class="job-a"' : ''}>${esc(left)}</span><span>${esc(right)}</span></div>`);
    txt.push([left, right].filter(Boolean).join(' — '));
  };

  const dates = (eduPrints(e, 'dates') || eduPrints(e, 'startDate')) ? eduDates(e) : '';

  if(cred){
    // Credential name on the left, endorsement right-justified.
    push(F('degree'), F('detail'), true);
    push(F('school'), dates, false);
    const tail = [F('license') && ('License ' + F('license')), F('status')].filter(Boolean).join(' · ');
    if(tail) push(tail, '', false);
  } else {
    const left = [F('school'), F('location')].filter(Boolean).join(', ');
    push(left, dates, true);
    push([F('degree'), F('detail')].filter(Boolean).join(' — '), '', false);
    const tail = [F('license') && ('GPA ' + F('license')), F('status')].filter(Boolean).join(' · ');
    if(tail) push(tail, '', false);
  }
  return { html: rows.join(''), text: txt.filter(Boolean).join(' | ') };
}

// Set-aside lives below the page, like speaker notes under a slide.
function buildAside(){
  const v = active();
  if(!v) return '';
  const asideJobs   = data.roles.filter(r => rset(v, r).place === 'off');
  const asideGroups = data.skillGroups.filter(g => v.skillsOn[g.id] === false);
  const asideSkills = [];
  data.skillGroups.forEach(g => {
    if(v.skillsOn[g.id] === false) return;
    const sel = skillSel(v, g);
    g.items.filter(i => !sel.includes(i.id)).forEach(i => asideSkills.push([g, i]));
  });
  const asideBullets = data.bullets.filter(b => { const p = placeOf(v, b.id); return p && p.at === 'backburner'; });
  const asideEdu = data.education.filter(e => v.eduOn[e.id] === false);
  const total = asideJobs.length + asideGroups.length + asideSkills.length + asideBullets.length + asideEdu.length;

  const groups = [
    ['Experience', asideJobs.map(r => asideRow('Job', r.company,
        `<button class="band-btn go" data-place="${r.id}|${SEC_MAIN}">Experience</button>
         <button class="band-btn" data-place="${r.id}|${SEC_ADD}">Additional</button>`))
      .concat(asideBullets.map(b => asideRow('Bullet', versionText(b, (placeOf(v, b.id)||{ver:0}).ver),
        `<button class="band-btn go" data-bandto="${b.id}|shelf">Shelf</button>
         <button class="band-btn" data-bandto="${b.id}|__none">Available</button>`)))],
    ['Skills', asideGroups.map(g => asideRow('Group', g.label,
        `<button class="band-btn go" data-groupback="${g.id}">Include</button>`))
      .concat(asideSkills.map(([g, i]) => asideRow(g.label, versionText(i, skillVer(v, i.id)),
        `<button class="band-btn go" data-stoggle="${g.id}|${i.id}|on">Include</button>`)))],
    ['Education', asideEdu.map(e => asideRow('Entry', e.degree || e.school,
        `<button class="band-btn go" data-eduback="${e.id}">Include</button>`))],
  ].filter(x => x[1].length);

  let h = '';
  const drafts = draftsOf(v);
  if(ui.draftsBelow === true){
    h += `<div class="asidehead">
      <strong>Drafts</strong>
      <span class="card-sub">${drafts.length} · never printed</span>
      <span style="flex:1"></span>
      <button class="btn sm" data-draftsabove="1">↑ Back onto the page</button>
    </div>`;
    if(!drafts.length){
      h += `<p class="hint" style="margin:8px 0 12px">No drafts yet.</p>`;
    } else {
      [...DRAFT_LEVELS].reverse().forEach(L => {
        const list = draftsAt(v, L.key);
        if(!list.length) return;
        h += `<div class="asidegroup"><div class="asidegroup-h">${L.label}</div>` +
          list.map(dr => `<div class="band-row">
            <span class="band-body static">${esc(dr.text) || '<em>empty draft</em>'}</span>
            <span class="band-acts">
              <button class="band-btn" data-draftlvl="${dr.id}|1" ${L.key >= 2 ? 'disabled' : ''}>↑</button>
              <button class="band-btn" data-draftlvl="${dr.id}|-1" ${L.key <= 0 ? 'disabled' : ''}>↓</button>
              ${L.key === 2 ? `<button class="band-btn go" data-draftpromote="${dr.id}">→ Bullet</button>` : ''}
              <button class="band-btn" data-draftdel="${dr.id}">×</button>
            </span>
          </div>`).join('') + `</div>`;
      });
    }
    h += `<div style="height:12px"></div>`;
  }

  h += `<div class="asidehead">
    <strong>Set aside</strong>
    <span class="card-sub">${total} item${total===1?'':'s'} · never printed</span>
    <span style="flex:1"></span>
    <button class="btn sm" data-asidecollapse="1">${ui.asidePanelOpen === false ? 'Show' : 'Hide'}</button>
  </div>`;
  if(ui.asidePanelOpen === false) return h;
  if(!total) return h + `<p class="hint" style="margin:8px 0 0">Nothing set aside yet. Anything you exclude lands here.</p>`;
  groups.forEach(([label, rows]) => {
    h += `<div class="asidegroup"><div class="asidegroup-h">${label}</div>${rows.join('')}</div>`;
  });
  return h;
}

  lines.push(P.line1); if(P.line2) lines.push(P.line2);

  if(v.showSummary && v.summary.trim()){
    h += `<h2 data-item="summary|_">Summary</h2>
      <p data-item="summary|_"${itemCls('summary','_')}>${esc(v.summary)}
        ${ui.sel && ui.sel.kind === 'summary' ? `<span class="inlinectl">${stateCtl(v, 'summary', '_')}</span>` : ''}</p>`;
    lines.push('', 'SUMMARY', v.summary);
  }

  const skills = orderedGroups(v).filter(s => v.skillsOn[s.id] !== false);
  if(skills.length){
    h += `<h2 data-item="skillsection|_">Skills</h2>`;
    lines.push('', 'SKILLS');
    skills.forEach(s => {
      const sel = skillSel(v, s);
      const picked = sel.map(id => s.items.find(i => i.id === id)).filter(Boolean)
        .map(i => ({ id: i.id, text: versionText(i, skillVer(v, i.id)) }))
        .filter(x => x.text);
      if(!picked.length) return;
      const html = picked.map(x => `<span data-item="si|${x.id}"${itemCls('skill', x.id)}>${esc(x.text)}${skillCtl(v, s, x.id)}</span>`).join(', ');
      h += `<p class="skill"><strong data-item="sg|${s.id}"${itemCls('skillgroup', s.id)}>${esc(s.label)}:${groupCtl(v, s)}</strong> ${html}</p>`;
      lines.push(`${s.label}: ${picked.map(x => x.text).join(', ')}`);
    });
  }

  // Three working bands. None of them print — see @media print.
  const drafts = draftsOf(v);
  if(drafts.length && ui.draftsBelow !== true){
    h += `<div class="docband draftband">
      <div class="band-tag" style="display:flex;gap:8px;align-items:center">
        <button class="band-tag" style="padding:0;width:auto" data-bandcopy="drafts">Drafts — will not print
          <span class="band-chip">copy all</span></button>
        <span style="flex:1"></span>
        <button class="band-btn" data-draftsbelow="1" title="Move below the page">↓ Below page</button>
      </div>`;
    [...DRAFT_LEVELS].reverse().forEach(L => {
      const list = draftsAt(v, L.key);
      if(!list.length) return;
      h += `<div class="band-level"><span class="band-lvl" title="${esc(L.hint)}">${L.label}</span>` +
        list.map(dr => {
          const editing = ui.draftEdit === dr.id;
          return `<div class="band-row${editing ? ' editing' : ''}">
            ${editing
              ? `<textarea class="band-ta" data-drafttext="${dr.id}" rows="2">${esc(dr.text)}</textarea>`
              : `<button class="band-body" data-draftedit="${dr.id}" title="Click to edit">${esc(dr.text) || '<em>empty draft</em>'}</button>`}
            <span class="band-acts">
              <button class="band-btn" data-draftlvl="${dr.id}|1" ${L.key >= 2 ? 'disabled' : ''}
                title="${L.key < 2 ? 'Promote to ' + DRAFT_LEVELS[L.key+1].label : 'Already at the top'}">↑</button>
              <button class="band-btn" data-draftlvl="${dr.id}|-1" ${L.key <= 0 ? 'disabled' : ''}
                title="${L.key > 0 ? 'Back to ' + DRAFT_LEVELS[L.key-1].label : 'Already at the bottom'}">↓</button>
              ${L.key === 2 ? `<button class="band-btn go" data-draftpromote="${dr.id}" title="Make this a real bullet">→ Bullet</button>` : ''}
              <button class="band-btn" data-draftdel="${dr.id}" title="Delete draft">×</button>
            </span>
          </div>`;
        }).join('') + `</div>`;
    });
    h += `<button class="band-add" data-draftadd="1">+ New draft</button></div>`;
  }

  const shelfIds = orderIn(v, 'shelf');
  if(shelfIds.length){
    h += `<div class="docband shelfband">
      <button class="band-tag" data-bandcopy="shelf">Shelf — will not print · wording is shared with the library
        <span class="band-chip">copy all</span></button>` +
      shelfIds.map(id => bandBulletRow(v, id, 'shelf')).join('') + `</div>`;
  }

  // Everything currently excluded, in one place, one click from coming back.
  const asideJobs   = data.roles.filter(r => rset(v, r).place === 'off');
  const asideGroups = data.skillGroups.filter(g => v.skillsOn[g.id] === false);
  const asideSkills = [];
  data.skillGroups.forEach(g => {
    if(v.skillsOn[g.id] === false) return;
    const sel = skillSel(v, g);
    g.items.filter(i => !sel.includes(i.id)).forEach(i => asideSkills.push([g, i]));
  });
  const asideBullets = data.bullets.filter(b => { const p = placeOf(v, b.id); return p && p.at === 'backburner'; });
  const asideEdu = data.education.filter(e => v.eduOn[e.id] === false);
  const asideTotal = asideJobs.length + asideGroups.length + asideSkills.length + asideBullets.length + asideEdu.length;

  const availIds = data.bullets.filter(b => !placeOf(v, b.id) && eligible(b).length).map(b => b.id);
  if(availIds.length){
    h += `<div class="docband availband">
      <div class="band-tag plain">Available — ${availIds.length} undecided · will not print</div>` +
      availIds.map(id => bandBulletRow(v, id, 'available')).join('') + `</div>`;
  }

  data.sections.forEach(sec => {
    const roles = data.roles.filter(r => rset(v, r).place === sec.id);
    if(!roles.length) return;
    h += `<h2 data-item="section|${sec.id}"${itemCls('section', sec.id)}>${esc(sec.label)}</h2>`;
    lines.push('', sec.label.toUpperCase());
    const style = sec.id === SEC_ADD ? addStyle(v) : 'full';
    if(style === 'list'){
      // Convention: bold the role title so each entry is scannable in a run-on list.
      const html = roles.map(r => {
        const rs = v.roles[r.id];
        const title = (rs.title || '').trim() || r.title;
        const tail = [r.company, r.location, r.dates].filter(Boolean).join(', ');
        return `<strong>${esc(title)}</strong>${tail ? ', ' + esc(tail) : ''}`;
      });
      const plain = roles.map(r => {
        const rs = v.roles[r.id];
        const title = (rs.title || '').trim() || r.title;
        return [title, r.company, r.location, r.dates].filter(Boolean).join(', ');
      });
      h += `<p class="runlist">${html.join('; ')}.</p>`;
      plain.forEach(p => lines.push(p));
      return;
    }
    roles.forEach(r => {
      const rs = v.roles[r.id];
      const title = (rs.title || '').trim() || r.title;
      const bl = style === 'compact' ? [] : orderIn(v, r.id).map(id => {
        const b = bulletById(id), p = placeOf(v, id) || {ver:0};
        return b ? { id, text: versionText(b, p.ver) } : null;
      }).filter(x => x && x.text);
      h += `<div class="job">
        <div class="job-b" data-item="role|${r.id}"${itemCls('role', r.id)}><span class="job-a">${esc(r.company)}</span><span>${esc(r.location)}${roleCtl(v, r)}</span></div>
        <div class="job-b" data-item="role|${r.id}"><span>${esc(title)}</span><span>${esc(r.dates)}</span></div>
        ${bl.length ? `<ul>${bl.map(x => docBulletLi(v, x)).join('')}</ul>` : ''}
      </div>`;
      lines.push(`${r.company}${r.location ? ', ' + r.location : ''}`, `${title} | ${r.dates}`);
      bl.forEach(x => lines.push('- ' + x.text));
      lines.push('');
    });
  });

  const edu = data.education.filter(e => v.eduOn[e.id] !== false);
  if(edu.length){
    h += `<h2 data-item="edusection|_">Education</h2>`;
    lines.push('', 'EDUCATION');
    edu.forEach(e => {
      const rows = eduRows(e);
      if(!rows.html) return;
      const eduSel = ui.sel && ui.sel.kind === 'edu' && ui.sel.id === e.id;
      h += `<div class="job" data-item="edu|${e.id}"${itemCls('edu', e.id)}>${rows.html}
        ${eduSel ? `<span class="inlinectl">
          <button class="ictl" data-eduaside="${e.id}" title="Set aside">⌄</button>
          ${stateCtl(v, 'edu', e.id)}
        </span>` : ''}</div>`;
      lines.push(rows.text);
    });
  }
  return { html:h, text: lines.join('\n').replace(/\n{3,}/g, '\n\n').trim() };
}

const BOUNDS_CONV = { fontSize:[10,11], lineHeight:[1,1.15], margin:[0.5,0.75], sectionGap:[0.85,1.2] };
const BOUNDS_WIDE = { fontSize:[8.5,14], lineHeight:[0.9,2],  margin:[0.25,1.5], sectionGap:[0.5,2.2] };
const IDEAL = { fontSize:10.5, lineHeight:1.08, margin:0.6, sectionGap:1 };
const BOUNDS = BOUNDS_CONV;
const clamp = (n, [lo,hi]) => Math.min(hi, Math.max(lo, n));

// Lay the document out at a trial size and report how many pages it fills.
function measure(fontSize, lineHeight, margin){
  const v = active(), doc = document.getElementById('doc');
  // Working bands never print, so they must not count toward the page estimate.
  const hidden = [...doc.querySelectorAll('.docband, .stageband, .shelfband')];
  const prevDisplay = hidden.map(el => el.style.display);
  hidden.forEach(el => { el.style.display = 'none'; });
  const keep = [doc.style.fontSize, doc.style.lineHeight, doc.style.padding];
  doc.style.fontSize = fontSize + 'pt';
  doc.style.lineHeight = lineHeight;
  doc.style.padding = margin + 'in';
  void doc.offsetHeight;
  const contentPx = doc.scrollHeight - (margin * 96 * 2);
  doc.style.fontSize = keep[0]; doc.style.lineHeight = keep[1]; doc.style.padding = keep[2];
  hidden.forEach((el, i) => { el.style.display = prevDisplay[i]; });
  return contentPx / ((11 - margin * 2) * 96);
}

function pageFill(){
  const v = active();
  if(!v) return { pages:0, fill:0, advice:'' };
  const pages = measure(v.fontSize, v.lineHeight, v.margin);
  const whole = Math.max(1, Math.ceil(pages - 0.02));
  const fill = pages / whole;
  let advice;
  if(pages > 1 && pages < 1.25) advice = 'Just over one page — the worst outcome. Cut a bullet or use Fit to page.';
  else if(fill < 0.75 && whole === 1) advice = `Only filling ${Math.round(fill*100)}% of the page. Add a bullet back, or let Fit to page open it up.`;
  else if(whole > 1 && fill < 0.5) advice = `Page ${whole} is barely used. Either fill it or cut back to ${whole-1}.`;
  else advice = `Filling ${Math.round(fill*100)}% of ${whole} page${whole>1?'s':''}. Sliders stay inside conventional ranges.`;
  return { pages, whole, fill, advice };
}

// Find the largest readable text size that still lands inside the target page count,
// then open up spacing if the page is left too empty.
function fitToPage(){
  const v = active();
  if(!v) return;
  const R = v.wideRange ? BOUNDS_WIDE : BOUNDS_CONV;
  const [fsLo] = R.fontSize, fsHi = Math.min(R.fontSize[1], 11.5);
  const target = measure(fsLo, R.lineHeight[0], v.margin) <= 1.001 ? 1
               : Math.ceil(measure(fsLo, R.lineHeight[0], v.margin) - 0.02);

  let lh = 1.08, lo = fsLo, hi = fsHi, best = fsLo;
  for(let i = 0; i < 18; i++){
    const mid = (lo + hi) / 2;
    if(measure(mid, lh, v.margin) <= target + 0.001){ best = mid; lo = mid; } else hi = mid;
  }
  best = Math.floor(best * 4) / 4;                       // snap to 0.25pt
  while(best > fsLo && measure(best, lh, v.margin) > target + 0.001) best -= 0.25;

  // Short on content? Open the leading rather than inflating the type.
  let fill = measure(best, lh, v.margin) / target;
  while(fill < 0.92 && lh < R.lineHeight[1]){
    const next = Math.min(R.lineHeight[1], lh + 0.02);
    if(measure(best, next, v.margin) > target + 0.001) break;
    lh = next;
    fill = measure(best, lh, v.margin) / target;
  }

  v.fontSize = clamp(best, R.fontSize);
  v.lineHeight = clamp(Math.round(lh * 100) / 100, R.lineHeight);
  save(); render();
}

function renderPreview(){
  const v = active(), doc = document.getElementById('doc'), sheet = document.getElementById('sheet');
  if(!v){ doc.innerHTML = ''; return; }
  const derivedBefore = v.name + '|' + v.headline;
  if(v.autoName !== false) v.name = autoFilename(v);
  v.headline = autoHeadline(v);
  delete v.headlineAuto;
  if(derivedBefore !== v.name + '|' + v.headline) save();   // derived fields changed: persist them
  const tc = todoCount(v);
  const tb = document.getElementById('todobar');
  if(tb){
    tb.innerHTML = tc.total
      ? `<span>${tc.left
          ? `<span class="dot-keep"></span><b>${tc.left}</b> of ${tc.total} not yet reviewed`
          : `All ${tc.total} items reviewed`}</span>
         <span style="flex:1"></span>
         <label class="switch" style="font-size:11.5px">
           <input type="checkbox" ${ui.showTodo === false ? '' : 'checked'} id="todoToggle"> Show highlights
         </label>`
      : '';
  }
  const ap = document.getElementById('asidePanel');
  if(ap) ap.innerHTML = buildAside();
  const built = buildDoc();
  doc.innerHTML = built.html;
  doc.style.fontSize = v.fontSize + 'pt';
  doc.style.lineHeight = v.lineHeight;
  doc.style.padding = v.margin + 'in';
  doc.querySelectorAll('h2').forEach(el => { el.style.marginTop = (1.1 * v.sectionGap) + 'em'; });
  let st = document.getElementById('pageStyle');
  if(!st){ st = document.createElement('style'); st.id = 'pageStyle'; document.head.appendChild(st); }
  st.textContent = `@page{size:letter;margin:${v.margin}in}
    @media print{.doc{padding:0 !important}}`;

  const contentPx = doc.scrollHeight - (v.margin * 96 * 2);
  const pagePx = (11 - v.margin * 2) * 96;
  const pages = contentPx / pagePx;
  const g = document.getElementById('gauge');
  const frac = pages % 1 === 0 ? 1 : pages % 1;
  g.classList.toggle('over', pages > 1.02 && pages < 1.9);
  g.querySelector('i').style.width = Math.min(100, frac * 100) + '%';
  document.getElementById('gaugeLabel').textContent =
    pages <= 1.02 ? `${Math.round(frac*100)}% of one page`
    : pages < 1.9 ? `Spills onto page 2 — ${Math.round((pages-1)*100)}% over`
    : `${pages.toFixed(1)} pages`;
  sheet.style.minHeight = (Math.ceil(Math.max(1, pages - 0.02)) * 11) + 'in';

  if(v.autoFit && !fitting){
    clearTimeout(fitTimer);
    fitTimer = setTimeout(() => {
      fitting = true;
      const before = v.fontSize + '/' + v.lineHeight;
      fitToPage();
      if(before === v.fontSize + '/' + v.lineHeight) fitting = false;
      else setTimeout(() => { fitting = false; }, 50);
    }, 500);
  }
}

/* ---------------- drag & drop ---------------- */
const body = document.getElementById('editorBody');
let dragBid = null;

let dragSid = null, dragSgroup = null;

body.addEventListener('dragstart', e => {
  const row = e.target.closest('.bl.drag');
  if(!row) return;
  if(row.dataset.sid){                       // a skill item: reorder within its group only
    dragSid = row.dataset.sid;
    dragSgroup = row.dataset.sgroup;
    row.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', dragSid); } catch(_){}
    body.querySelectorAll('.skillzone').forEach(z => {
      z.classList.add(z.dataset.szone === dragSgroup ? 'valid' : 'invalid');
    });
    return;
  }
  dragBid = row.dataset.bid;
  row.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', dragBid); } catch(_){}
  const b = bulletById(dragBid);
  const ok = new Set(b ? eligible(b) : []);
  // Light up only the zones this bullet is actually allowed to land in.
  body.querySelectorAll('.zone').forEach(z => {
    const zn = z.dataset.zone;
    const holding = zn === 'shelf' || zn === 'staging' || zn === 'backburner';
    z.classList.add(holding || ok.has(zn) ? 'valid' : 'invalid');
  });
});

body.addEventListener('dragend', () => {
  dragBid = null; dragSid = null; dragSgroup = null;
  clearMarker();
  body.querySelectorAll('.skillzone').forEach(z => z.classList.remove('valid','invalid','over'));
  body.querySelectorAll('.bl.drag').forEach(r => r.classList.remove('dragging'));
  body.querySelectorAll('.zone').forEach(z => z.classList.remove('valid','invalid','over'));
});

function clearMarker(){
  body.querySelectorAll('.dropline').forEach(el => el.remove());
}

// Which row is the pointer nearest, and is it above or below the midpoint?
function markerTarget(zone, y){
  const rows = [...zone.querySelectorAll('.bl.drag')].filter(r => r.dataset.bid !== dragBid);
  for(const r of rows){
    const box = r.getBoundingClientRect();
    if(y < box.top + box.height / 2) return { before: r };
  }
  return { before: null };
}

function markerTargetSkill(zone, y){
  const rows = [...zone.querySelectorAll('.bl.drag.sk')].filter(r => r.dataset.sid !== dragSid);
  for(const r of rows){
    const box = r.getBoundingClientRect();
    if(y < box.top + box.height / 2) return { before: r };
  }
  return { before: null };
}

body.addEventListener('dragover', e => {
  const sz = e.target.closest('.skillzone');
  if(sz && dragSid){
    if(sz.dataset.szone !== dragSgroup) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    sz.classList.add('over');
    clearMarker();
    const line = document.createElement('div');
    line.className = 'dropline';
    const t = markerTargetSkill(sz, e.clientY);
    if(t.before) sz.insertBefore(line, t.before); else sz.appendChild(line);
    return;
  }
  const z = e.target.closest('.zone');
  if(!z || !dragBid || z.classList.contains('invalid')) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  z.classList.add('over');
  clearMarker();
  const line = document.createElement('div');
  line.className = 'dropline';
  const t = markerTarget(z, e.clientY);
  if(t.before) z.insertBefore(line, t.before);
  else {
    const empty = z.querySelector('.zone-empty');
    if(empty) z.insertBefore(line, empty);
    else z.appendChild(line);
  }
});

body.addEventListener('dragleave', e => {
  const z = e.target.closest('.zone');
  if(z && !z.contains(e.relatedTarget)){ z.classList.remove('over'); clearMarker(); }
});

body.addEventListener('drop', e => {
  const sz = e.target.closest('.skillzone');
  if(sz && dragSid){
    if(sz.dataset.szone !== dragSgroup) return;
    e.preventDefault();
    const v = active();
    const t = markerTargetSkill(sz, e.clientY);
    const beforeId = t.before ? t.before.dataset.sid : null;
    clearMarker();
    const g = data.skillGroups.find(x => x.id === dragSgroup);
    const sel = skillSel(v, g);
    const from = sel.indexOf(dragSid);
    if(from > -1){
      sel.splice(from, 1);
      const to = beforeId ? sel.indexOf(beforeId) : sel.length;
      sel.splice(to < 0 ? sel.length : to, 0, dragSid);
    }
    dragSid = null; dragSgroup = null;
    save(); render();
    return;
  }
  const z = e.target.closest('.zone');
  if(!z || !dragBid || z.classList.contains('invalid')) return;
  e.preventDefault();
  const v = active(), zone = z.dataset.zone;
  const t = markerTarget(z, e.clientY);
  const beforeId = t.before ? t.before.dataset.bid : null;
  clearMarker();
  setPlace(v, dragBid, zone);                 // appends to the end
  const ord = orderIn(v, zone);
  const from = ord.indexOf(dragBid);
  if(from > -1){
    ord.splice(from, 1);
    const to = beforeId ? ord.indexOf(beforeId) : ord.length;
    ord.splice(to < 0 ? ord.length : to, 0, dragBid);
  }
  dragBid = null;
  save(); render();
});

/* ---------------- reorder jobs by dragging ---------------- */
let roleDrag = null;

body.addEventListener('dragstart', e => {
  const card = e.target.closest('[data-dragrole]');
  if(!card) return;
  roleDrag = { id: card.dataset.dragrole, group: card.dataset.draggroup };
  card.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', roleDrag.id); } catch(_){}
});

body.addEventListener('dragend', () => {
  roleDrag = null;
  body.querySelectorAll('.rolecard').forEach(c =>
    c.classList.remove('dragging', 'drop-above', 'drop-below'));
});

body.addEventListener('dragover', e => {
  if(!roleDrag) return;
  const card = e.target.closest('[data-dragrole]');
  if(!card || card.dataset.draggroup !== roleDrag.group) return;   // same section only
  if(card.dataset.dragrole === roleDrag.id) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  body.querySelectorAll('.rolecard').forEach(c => c.classList.remove('drop-above', 'drop-below'));
  const box = card.getBoundingClientRect();
  card.classList.add(e.clientY < box.top + box.height / 2 ? 'drop-above' : 'drop-below');
});

body.addEventListener('drop', e => {
  if(!roleDrag) return;
  const card = e.target.closest('[data-dragrole]');
  if(!card || card.dataset.draggroup !== roleDrag.group) return;
  e.preventDefault();
  const box = card.getBoundingClientRect();
  const before = e.clientY < box.top + box.height / 2;
  const targetId = card.dataset.dragrole;
  if(targetId !== roleDrag.id){
    const a = data.roles.findIndex(r => r.id === roleDrag.id);
    const [moved] = data.roles.splice(a, 1);
    let b = data.roles.findIndex(r => r.id === targetId);
    data.roles.splice(before ? b : b + 1, 0, moved);
  }
  roleDrag = null;
  body.querySelectorAll('.rolecard').forEach(c =>
    c.classList.remove('dragging', 'drop-above', 'drop-below'));
  save(); render();
});

/* ---------------- events ---------------- */

body.addEventListener('input', e => {
  const t = e.target, v = active();
  const live = t.dataset.live, num = t.dataset.num;
  if(live){
    const [scope, key] = live.split('.');
    (scope === 'v' ? v : data.profile)[key] = t.value;
    if(t.classList.contains('grow')) autoGrow(t);
    if(live === 'v.note' || live === 'v.roleTitle' || live === 'v.employer'){
      const o = document.querySelector(`#variantPick option[value="${v.id}"]`);
      if(o) o.textContent = menuLabel(v);
      document.title = filenameOf(v);
      v.headline = autoHeadline(v);
    }
  }
  else if(t.dataset.filename){
    v.autoName = false;
    v.filename = t.value;
    v.name = t.value;
    document.title = filenameOf(v);
  }
  else if(t.dataset.slider){
    const n = parseFloat(t.value);
    if(!isNaN(n)){
      v[t.dataset.slider] = n;
      const lab = t.closest('label');
      const b = lab && lab.querySelector('b');
      if(b) b.textContent = n + (b.dataset.unit || '');
    }
  }
  else if(t.dataset.roletitle){ rset(v, data.roles.find(r=>r.id===t.dataset.roletitle)).title = t.value; }
  else if(t.id === 'libFilter'){
    ui.filter = t.value;
    clearTimeout(ui.filterTimer);
    ui.filterTimer = setTimeout(() => {
      render();
      const f = document.getElementById('libFilter');
      if(f){ f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
    }, 220);
    return;
  }
  else if(t.dataset.vertext){
    const [id, i] = t.dataset.vertext.split('|');
    setVersionText(bulletById(id), Number(i), t.value);
    autoGrow(t); renderPreviewSoon();
  }
  else if(t.dataset.svertext){
    const [id, i] = t.dataset.svertext.split('|');
    let item = null;
    data.skillGroups.forEach(g => g.items.forEach(x => { if(x.id === id) item = x; }));
    if(item) setVersionText(item, Number(i), t.value);
    autoGrow(t); renderPreviewSoon();
  }
  else if(t.dataset.btext){ bulletById(t.dataset.btext).text = t.value; autoGrow(t); }
  else if(t.dataset.ref){
    const [id, key] = t.dataset.ref.split('|');
    const r = refsList().find(x => x.id === id);
    if(r) r[key] = t.value;
  }
  else if(t.dataset.letter){
    const [rid, lid, key] = t.dataset.letter.split('|');
    const r = refsList().find(x => x.id === rid);
    const L = r && (r.letters || []).find(x => x.id === lid);
    if(L) L[key] = t.value;
  }
  else if(t.dataset.fact){
    const [id, key] = t.dataset.fact.split('|');
    const f = factsList().find(x => x.id === id);
    if(f) f[key] = t.value;
  }
  else if(t.dataset.app){
    const [rid, key] = t.dataset.app.split('|');
    appOf(roleById(rid))[key] = t.value;
  }
  else if(t.dataset.btags){
    bulletById(t.dataset.btags).tags = t.value.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);
  }
  else if(t.dataset.cat){
    const [id, f] = t.dataset.cat.split('|');
    catById(id)[f] = t.value;
  }
  else if(t.dataset.skillitemtext){
    const [gid, iid] = t.dataset.skillitemtext.split('|');
    data.skillGroups.find(g=>g.id===gid).items.find(i=>i.id===iid).text = t.value;
    autoGrow(t);
  }
  else if(t.dataset.role){
    const [id, f] = t.dataset.role.split('|');
    data.roles.find(r => r.id === id)[f] = t.value;
  }
  else if(t.dataset.bullet){
    const [rid, bid, f] = t.dataset.bullet.split('|');
    const b = data.roles.find(r=>r.id===rid).bullets.find(x=>x.id===bid);
    if(f === 'tags') b.tags = t.value.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
    else b.text = t.value;
  }
  else if(t.dataset.section){
    data.sections.find(s => s.id === t.dataset.section).label = t.value;
  }
  else if(t.dataset.skill){
    const [id, f] = t.dataset.skill.split('|');
    data.skillGroups.find(s => s.id === id)[f] = t.value;
  }
  else if(t.dataset.edu){
    const [id, f] = t.dataset.edu.split('|');
    data.education.find(x => x.id === id)[f] = t.value;
  }
  else return;
  renderPreview(); save();
});

body.addEventListener('change', e => {
  const t = e.target, v = active();
  if(t.dataset.toggle){
    const key = t.dataset.toggle.split('.')[1];
    v[key] = t.checked;
    if(key === 'wideRange' && !t.checked){
      Object.keys(BOUNDS_CONV).forEach(k => { v[k] = clamp(v[k], BOUNDS_CONV[k]); });
    }
  }
  else if(t.dataset.onlyresume){
    ui.onlyOnResume = t.checked;
    save(); render(); return;
  }
  else if(t.dataset.refok){
    const r = refsList().find(x => x.id === t.dataset.refok);
    if(r) r.askedPermission = t.checked;
    save(); return;
  }
  else if(t.dataset.eduprint){
    const [id, key] = t.dataset.eduprint.split('|');
    eduSetPrint(data.education.find(x => x.id === id), key, t.checked);
    save(); render(); return;
  }
  else if(t.dataset.edurange){
    data.education.find(x => x.id === t.dataset.edurange).showRange = t.checked;
    save(); render(); return;
  }
  else if(t.dataset.appcontact){
    appOf(roleById(t.dataset.appcontact)).mayContact = t.checked;
    save(); return;
  }
  else if(t.dataset.catrole){
    const [cid, rid] = t.dataset.catrole.split('|');
    const c = catById(cid);
    c.roles = c.roles || [];
    c.roles = t.checked ? [...new Set([...c.roles, rid])] : c.roles.filter(x => x !== rid);
    save(); render(); return;
  }
  else if(t.dataset.bcat){
    const [bid, cid] = t.dataset.bcat.split('|');
    const b = bulletById(bid);
    b.cats = b.cats || [];
    b.cats = t.checked ? [...new Set([...b.cats, cid])] : b.cats.filter(x => x !== cid);
    save(); render(); return;
  }
  else if(t.dataset.belig){
    const [bid, rid] = t.dataset.belig.split('|');
    const b = bulletById(bid);
    b.add = b.add || []; b.ex = b.ex || [];
    // Work out what the categories alone would say, then set the override that differs.
    const fromCats = new Set();
    (b.cats||[]).forEach(cid => { const c = catById(cid); if(c) (c.roles||[]).forEach(r => fromCats.add(r)); });
    b.add = b.add.filter(x => x !== rid);
    b.ex  = b.ex.filter(x => x !== rid);
    if(t.checked && !fromCats.has(rid)) b.add.push(rid);
    if(!t.checked && fromCats.has(rid)) b.ex.push(rid);
    save(); render(); return;
  }
  else if(t.dataset.mergesec){
    const from = t.dataset.mergesec, to = t.value;
    if(!to) return;
    if(!confirm(`Move every job in "${sectionOf(from).label}" into "${sectionOf(to).label}" and delete the empty section?`)){ render(); return; }
    data.roles.forEach(r => { if(r.sectionId === from) r.sectionId = to; });
    data.variants.forEach(vv => Object.values(vv.roles || {}).forEach(rs => { if(rs.place === from) rs.place = to; }));
    data.sections = data.sections.filter(x => x.id !== from);
    save(); render(); return;
  }
  else if(t.dataset.secstyle){
    const sec = data.sections.find(s=>s.id===t.dataset.secstyle);
    sec.style = t.value;
    sec.compact = (t.value !== 'full');
  }
  else if(t.dataset.skillon){ v.skillsOn[t.dataset.skillon] = t.checked; }
  else if(t.dataset.skillitem){
    const [gid, iid] = t.dataset.skillitem.split('|');
    const g = data.skillGroups.find(x=>x.id===gid), sel = skillSel(v, g);
    if(t.checked){ if(!sel.includes(iid)) sel.push(iid); }
    else v.skillItems[gid] = sel.filter(x => x !== iid);
  }
  else if(t.dataset.eduon){ v.eduOn[t.dataset.eduon] = t.checked; }
  else if(t.dataset.role){ const [id,f] = t.dataset.role.split('|'); data.roles.find(r=>r.id===id)[f] = t.value; }
  else return;
  save(); render();
});

// Clicking the body of an inspector card selects that item so the page highlights it.
body.addEventListener('click', e => {
  if(!e.target.closest('button')){
    const card = e.target.closest('[data-selitem]');
    if(card){
      const [k, id] = card.dataset.selitem.split('|');
      if(!(ui.sel && ui.sel.kind === k && ui.sel.id === id)) selectItem(k, id);
      return;
    }
  }
  const t = e.target.closest('button'); if(!t) return;
  const v = active();
  const d = t.dataset;

  if(d.place){
    const [rid, target] = d.place.split('|');
    rset(v, data.roles.find(r => r.id === rid)).place = target;
    save(); render(); return;
  }
  if(d.rolemove){
    const [id, dir] = d.rolemove.split('|');
    moveRoleWithinSection(id, Number(dir));
    save(); render(); return;
  }
  if(d.delrole){
    if(!confirm('Delete this role from the library and every variant?')) return;
    data.roles = data.roles.filter(r => r.id !== d.delrole);
    data.categories.forEach(c => { c.roles = (c.roles||[]).filter(x => x !== d.delrole); });
    data.bullets.forEach(b => {
      b.add = (b.add||[]).filter(x => x !== d.delrole);
      b.ex  = (b.ex ||[]).filter(x => x !== d.delrole);
    });
    data.variants.forEach(vv => {
      delete vv.roles[d.delrole];
      Object.keys(vv.place||{}).forEach(bid => { if(vv.place[bid].at === d.delrole) delete vv.place[bid]; });
      if(vv.order) delete vv.order[d.delrole];
    });
    save(); render(); return;
  }
  if(d.secmove){
    const [id, dir] = d.secmove.split('|');
    const i = data.sections.findIndex(s=>s.id===id), j = i + Number(dir);
    if(j >= 0 && j < data.sections.length){ const [s] = data.sections.splice(i,1); data.sections.splice(j,0,s); }
    save(); render(); return;
  }
  if(d.delsection){
    const used = data.roles.filter(r => r.sectionId === d.delsection).length;
    if(used && !confirm(`${used} role(s) sit in this section. They will move to "${data.sections.find(s=>s.id!==d.delsection).label}".`)) return;
    data.sections = data.sections.filter(s => s.id !== d.delsection);
    data.roles.forEach(r => { if(r.sectionId === d.delsection) r.sectionId = data.sections[0].id; });
    data.variants.forEach(vv => Object.values(vv.roles).forEach(rs => { if(rs.place === d.delsection) rs.place = data.sections[0].id; }));
    save(); render(); return;
  }
  if(d.peek){
    const [bid, dir] = d.peek.split('|');
    const n = versionsOf(bulletById(bid)).length;
    ui.peek[bid] = Math.min(n - 1, Math.max(0, (ui.peek[bid] || 0) + Number(dir)));
    render(); return;
  }
  if(d.sver){
    const [iid, dir] = d.sver.split('|');
    let item = null;
    data.skillGroups.forEach(g => g.items.forEach(i => { if(i.id === iid) item = i; }));
    if(item){
      const n = versionsOf(item).length;
      setSkillVer(v, iid, Math.min(n - 1, Math.max(0, skillVer(v, iid) + Number(dir))));
    }
    save(); render(); return;
  }
  if(d.ver){
    const [bid, dir] = d.ver.split('|');
    const p = placeOf(v, bid);
    if(p){
      const n = versionsOf(bulletById(bid)).length;
      p.ver = Math.min(n - 1, Math.max(0, (p.ver || 0) + Number(dir)));
    }
    save(); render(); return;
  }
  if(d.bmove){
    const [bid, zone, dir] = d.bmove.split('|');
    const ord = orderIn(v, zone);
    const i = ord.indexOf(bid), j = i + Number(dir);
    if(j >= 0 && j < ord.length){ ord.splice(i,1); ord.splice(j,0,bid); }
    save(); render(); return;
  }
  if(d.skillgroupmove){
    const [id, dir] = d.skillgroupmove.split('|');
    const i = data.skillGroups.findIndex(g=>g.id===id), j = i + Number(dir);
    if(j >= 0 && j < data.skillGroups.length){ const [g] = data.skillGroups.splice(i,1); data.skillGroups.splice(j,0,g); }
    data.variants.forEach(vv => { vv.groupOrder = []; });   // library reorder resets variant overrides
    save(); render(); return;
  }
  if(d.skillitemmove){
    const [gid, iid, dir] = d.skillitemmove.split('|');
    const g = data.skillGroups.find(x=>x.id===gid);
    const i = g.items.findIndex(x=>x.id===iid), j = i + Number(dir);
    if(j >= 0 && j < g.items.length){ const [it] = g.items.splice(i,1); g.items.splice(j,0,it); }
    save(); render(); return;
  }
  if(d.groupmove){
    const [id, dir] = d.groupmove.split('|');
    const order = orderedGroups(v).map(g => g.id);
    const i = order.indexOf(id), j = i + Number(dir);
    if(j >= 0 && j < order.length){ order.splice(i,1); order.splice(j,0,id); v.groupOrder = order; }
    save(); render(); return;
  }
  if(d.tozone){
    const [bid, z] = d.tozone.split('|');

  }
  if(d.bandto){

  if(d.bandver){

  if(d.vartab){
    const ed = document.querySelector('.editor');
    ui.scroll['variant:' + ui.varTab] = ed ? ed.scrollTop : 0;
    ui.varTab = d.vartab; render();
    requestAnimationFrame(() => {
      const e2 = document.querySelector('.editor');
      if(e2) e2.scrollTop = ui.scroll['variant:' + ui.varTab] || 0;
    });
    return;
  }
  if(d.libtab){
    const ed = document.querySelector('.editor');
    ui.scroll['library:' + ui.libTab] = ed ? ed.scrollTop : 0;
    ui.libTab = d.libtab; render();
    requestAnimationFrame(() => {
      const e2 = document.querySelector('.editor');
      if(e2) e2.scrollTop = ui.scroll['library:' + ui.libTab] || 0;
    });
    return;
  }
  if(d.inspectclose){ clearSelection(); return; }
  if(d.selitem){
    const [k, id] = d.selitem.split('|');
    selectItem(k, id);
    return;
  }
  if(d.usever){
    const [id, i] = d.usever.split('|');
    const p = placeOf(v, id);
    if(p) p.ver = Number(i);
    save(); render(); return;
  }
  if(d.addver){
    const b = bulletById(d.addver);
    const idx = addVersion(b, versionText(b, 0));
    const p = placeOf(v, d.addver);
    if(p) p.ver = idx;
    save(); render(); return;
  }
  if(d.delver){
    const [id, i] = d.delver.split('|');
    const b = bulletById(id);
    if(removeVersion(b, Number(i))){
      const p = placeOf(v, id);
      if(p) p.ver = Math.min(p.ver, versionsOf(b).length - 1);
    }
    save(); render(); return;
  }
  if(d.usesver){
    const [id, i] = d.usesver.split('|');
    setSkillVer(v, id, Number(i));
    save(); render(); return;
  }
  if(d.addsver || d.delsver){
    const raw = d.addsver || d.delsver;
    const [id, i] = raw.split('|');
    let item = null;
    data.skillGroups.forEach(g => g.items.forEach(x => { if(x.id === id) item = x; }));
    if(item){
      if(d.addsver){ setSkillVer(v, id, addVersion(item, versionText(item, 0))); }
      else if(removeVersion(item, Number(i))){
        setSkillVer(v, id, Math.min(skillVer(v, id), versionsOf(item).length - 1));
      }
    }
    save(); render(); return;
  }
  if(d.eligopen){ ui.eligOpen[d.eligopen] = !ui.eligOpen[d.eligopen]; render(); return; }
  if(d.sumopen){ ui.sumItemOpen[d.sumopen] = !ui.sumItemOpen[d.sumopen]; render(); return; }
  if(d.copysum){
    const x = (data.summaries||[]).find(y => y.id === d.copysum);
    if(x) navigator.clipboard.writeText(x.text).then(() => {
      t.textContent = 'Copied'; setTimeout(() => { t.textContent = 'Copy'; }, 1500);
    }).catch(() => { t.textContent = 'Select the text above'; });
    return;
  }
  if(d.delsum){
    const x = (data.summaries||[]).find(y => y.id === d.delsum);
    if(!x) return;
    const label = [x.title, x.employer].filter(Boolean).join(' — ') || 'this summary';
    if(!confirm(`Delete the saved summary for ${label}?\n\nThis cannot be undone from here — only with Cmd/Ctrl+Z.`)) return;
    const owner = data.variants.find(y => y.id === x.from);
    if(owner) owner.summaryArchivedOff = x.text;
    data.summaries = (data.summaries||[]).filter(y => y.id !== d.delsum);
    save(); render(); return;
  }
  if(d.addstyle){ v.addStyle = d.addstyle; save(); render(); return; }
  if(d.stoggle){
    const [gid, iid, mode] = d.stoggle.split('|');
    const g = data.skillGroups.find(x=>x.id===gid), sel = skillSel(v, g);
    if(mode === 'on'){ if(!sel.includes(iid)) sel.push(iid); }
    else v.skillItems[gid] = sel.filter(x => x !== iid);
    save(); render(); return;
  }
  if(d.smove){
    const [gid, iid, dir] = d.smove.split('|');
    const g = data.skillGroups.find(x=>x.id===gid), sel = skillSel(v, g);
    const i = sel.indexOf(iid), j = i + Number(dir);
    if(j >= 0 && j < sel.length){ sel.splice(i,1); sel.splice(j,0,iid); }
    save(); render(); return;
  }
  if(d.addskillitem){
    data.skillGroups.find(g=>g.id===d.addskillitem).items.push({ id: uid('si'), text:'', tag:'' });
    normalize(data);
    save(); render(); return;
  }
  if(d.delskillitem){
    const [gid, iid] = d.delskillitem.split('|');
    const g = data.skillGroups.find(x=>x.id===gid);
    g.items = g.items.filter(i => i.id !== iid);
    data.variants.forEach(vv => { if(vv.skillItems && vv.skillItems[gid]) vv.skillItems[gid] = vv.skillItems[gid].filter(x => x !== iid); });
    save(); render(); return;
  }
  if(d.delbullet){
    if(!confirm('Delete this bullet from the library and every variant?')) return;
    deleteBullet(d.delbullet);
    save(); render(); return;
  }
  if(d.delcat){
    if(!confirm('Delete this category? Bullets keep any jobs added directly.')) return;
    if(ui.catOpen === d.delcat) ui.catOpen = null;
    data.categories = data.categories.filter(c => c.id !== d.delcat);
    data.bullets.forEach(b => { b.cats = (b.cats||[]).filter(x => x !== d.delcat); });
    save(); render(); return;
  }
  if(d.delskill){ data.skillGroups = data.skillGroups.filter(s => s.id !== d.delskill); save(); render(); return; }
  if(d.deledu){ data.education = data.education.filter(x => x.id !== d.deledu); save(); render(); return; }

  switch(t.id){
    case 'autoFit': fitToPage(); break;    case 'newStagedFromPosting': {
      const nb = { id: uid('b'), text:'', tags:[], cats:[], add:[], ex:[] };
      data.bullets.push(nb);
      setPlace(v, nb.id, 'staging');
      save(); render(); break; }
    case 'splitPosting': {
      const lines = (v.posting || '').split(/\n+/)
        .map(l => l.replace(/^[\s\u2022\u00b7*-]+/, '').trim())
        .filter(l => l.length > 12);
      if(!lines.length){ alert('Paste the posting text first.'); break; }
      lines.forEach(l => {
        const nb = { id: uid('b'), text: l, tags:[], cats:[], add:[], ex:[] };
        data.bullets.push(nb);
        setPlace(v, nb.id, 'staging');
      });
      save(); render(); break; }
    case 'toggleSummaries': ui.sumOpen = !ui.sumOpen; render(); break;
    case 'markAllDone': {
      const vv = active();
      vv.done = {};
      data.sections.forEach(sec => {
        const style = sec.id === SEC_ADD ? addStyle(vv) : 'full';
        data.roles.filter(r => rset(vv, r).place === sec.id).forEach(r => {
          vv.done[doneKey('role', r.id)] = { kept: true, worded: true };
          if(style === 'full') orderIn(vv, r.id).forEach(id => { vv.done[doneKey('bullet', id)] = { kept: true, worded: true }; });
        });
      });
      vv.done[doneKey('summary', '_')] = { kept: true, worded: true };
      save(); render(); break; }
    case 'markAllTodo': { const vv = active(); vv.done = {}; save(); render(); break; }
    case 'swapTitleEmp': {
      const vv = active();
      const t = vv.roleTitle || ''; vv.roleTitle = vv.employer || ''; vv.employer = t;
      save(); render(); break; }
    case 'resetName': {
      const vv = active(); vv.autoName = true; delete vv.filename;
      vv.name = autoFilename(vv); save(); render(); break; }
    case 'addBullet':
      data.bullets.push({ id: uid('b'), text:'', tags:[], cats:[], add:[], ex:[] });
      save(); render(); break;
    case 'addCat': {
      const c = { id: uid('cat'), label:'New category', roles:[] };
      data.categories.push(c);
      ui.catOpen = c.id;
      save(); render(); break; }
    case 'newStaged': {
      const nb = { id: uid('b'), text:'', tags:[], cats:[], add:[], ex:[] };
      data.bullets.push(nb);
      setPlace(v, nb.id, 'staging');
      save(); render(); break; }
    case 'addSection':
      data.sections.push({ id: uid('sec'), label:'New section' }); save(); render(); break;
    case 'addRole': {
      const r = { id: uid('r'), sectionId: data.sections[0].id, company:'', title:'', location:'', dates:'' };
      data.roles.push(r);
      data.variants.forEach(vv => { vv.roles[r.id] = { place: data.sections[0].id, title:'' }; });
      normalize(data);
      save(); render(); break; }
    case 'addSkill': data.skillGroups.push({ id: uid('s'), label:'', items:[{ id: uid('si'), text:'', tag:'' }] }); normalize(data); save(); render(); break;
    case 'addEdu':
      data.education.push({ id: uid('e'), kind:'education', school:'', degree:'', location:'', detail:'',
        startDate:'', dates:'', license:'', status:'' });
      normalize(data); save(); render(); break;
    case 'addCred':
      data.education.push({ id: uid('e'), kind:'credential', school:'', degree:'', location:'', detail:'',
        startDate:'', dates:'', license:'', status:'' });
      normalize(data); save(); render(); break;
    case 'wipe':
      if(!confirm('This clears all roles, bullets and variants. Your backup file is the only way back.')) return;
      data = { profile:{name:'',line1:'',line2:''}, sections:[{id:'sec_exp',label:'Experience'}],
               roles:[], categories:[], bullets:[], education:[], skillGroups:[], variants:[] };
      data.variants.push(newVariant('Base'));
      data.activeId = data.variants[0].id;
      save(); render(); break;
  }
});

  ui.scroll[ui.tab] = ed ? ed.scrollTop : 0;      // remember where we were
  ui.tab = name;
  render();
  if(ed) requestAnimationFrame(() => { ed.scrollTop = ui.scroll[name] || 0; });
}

document.getElementById('tabVariant').onclick = () => switchTab('variant');
document.getElementById('tabPosting').onclick = () => switchTab('posting');

};

function applyScale(){
  const z = Number(data.uiScale) || 0.8;
  const app = document.getElementById('app');
  app.style.transform = ''; app.style.width = ''; app.style.height = '';
  document.documentElement.style.zoom = z;
  document.body.style.zoom = '';
  document.getElementById('uiScale').value = String(z);
}
// The frame finishes sizing itself after boot, which was undoing the first call.
function applyScaleRepeatedly(){
  applyScale();
  requestAnimationFrame(applyScale);
  [0, 60, 250, 800].forEach(ms => setTimeout(applyScale, ms));
}
document.getElementById('autoBackup').onchange = e => {

document.getElementById('uiScale').onchange = e => {

};

// Zoom must not follow the resume onto paper.
window.addEventListener('beforeprint', () => {
  document.documentElement.style.zoom = 1;
  const sh = document.getElementById('sheet');
  sh.dataset.minh = sh.style.minHeight || '';
  sh.style.minHeight = '0';          // inline beats the stylesheet, so clear it inline
  sh.style.height = 'auto';
});
window.addEventListener('afterprint', () => {
  const sh = document.getElementById('sheet');
  sh.style.minHeight = sh.dataset.minh || '';
  sh.style.height = '';
  applyScale();
});
window.addEventListener('load', applyScale);
window.addEventListener('afterprint', applyScale);

const docEl = document.getElementById('doc');

docEl.addEventListener('keydown', e => {
  if(e.key === 'Escape' && (ui.sbEdit || ui.shelfEdit)){
    ui.sbEdit = null; ui.shelfEdit = null;
    save();
    render();
  }
});

// Losing focus closes the editor — no need to hunt for the tick.
docEl.addEventListener('focusout', e => {
  const ta = e.target;
  if(!ta.classList || !(ta.classList.contains('sb-text') || ta.classList.contains('shelfta'))) return;
  setTimeout(() => {                       // let a click on a sibling button land first
    const active_ = document.activeElement;
    if(active_ && active_.closest && active_.closest('.sb-item, .shelfrow')) return;
    if(!ui.sbEdit && !ui.shelfEdit) return;
    ui.sbEdit = null; ui.shelfEdit = null;
    save();
    render();
  }, 60);
});

// Clicking anywhere outside the band closes it too.
document.addEventListener('mousedown', e => {
  const inEditor = e.target.closest && e.target.closest('.sb-item, .shelfrow, li.is-editing, .band-row.editing');
  if(inEditor) return;
  // Never pre-empt a button. mousedown fires before click, so re-rendering here
  // destroys the element and the click never reaches its handler.
  if(e.target.closest && e.target.closest('button, [data-item], [data-selitem], input, textarea, select, label')) return;

  let changed = false;
  if(ui.sbEdit || ui.shelfEdit || ui.docEdit || ui.draftEdit || ui.bandEdit){
    ui.sbEdit = null; ui.shelfEdit = null; ui.docEdit = null; ui.draftEdit = null; ui.bandEdit = null;
    ui.editOkFor = null;
    changed = true;
  }
  // Clicking blank space on the page clears the selection as well.
  const onDoc = e.target.closest && e.target.closest('#doc');
  const onItem = e.target.closest && e.target.closest('[data-item], [data-bandsel], .editor, .topbar, .notes-panel, .notes-fab');
  if(ui.sel && onDoc && !onItem){ ui.sel = null; if(ui.tab === 'inspect') ui.tab = 'variant'; changed = true; }
  if(changed){ save(); render(); }
});

// beforeinput fires before the character lands, so the edit can be stopped cleanly.
function bulletForTextarea(t){
  const d = t.dataset || {};
  if(d.doctext)  return { id: d.doctext,  ver: (placeOf(active(), d.doctext) || {}).ver || 0 };
  if(d.bandtext) return { id: d.bandtext, ver: (placeOf(active(), d.bandtext) || {}).ver || 0 };
  if(d.btext)    return { id: d.btext,    ver: (placeOf(active(), d.btext) || {}).ver || 0 };
  if(d.vertext){ const [id, i] = d.vertext.split('|'); return { id, ver: Number(i) }; }
  return null;
}

function interceptSharedTyping(e){
  const t = e.target;
  if(!t || t.tagName !== 'TEXTAREA') return;
  const info = bulletForTextarea(t);
  if(!info || !bulletById(info.id)) return;
  if(!editNeedsAsk(info.id, info.ver)) return;
  e.preventDefault();
  openSharedModal(info.id, info.ver);
}

docEl.addEventListener('beforeinput', interceptSharedTyping);
document.getElementById('editorBody').addEventListener('beforeinput', interceptSharedTyping);

docEl.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset && t.dataset.bandtext){
    const b = bulletById(t.dataset.bandtext);
    const p = placeOf(active(), t.dataset.bandtext) || { ver: 0 };
    if(b){ setVersionText(b, p.ver || 0, t.value); autoGrow(t); save(); }
    return;
  }
  if(t.dataset && t.dataset.doctext){
    const b = bulletById(t.dataset.doctext);
    const p = placeOf(active(), t.dataset.doctext) || { ver: 0 };
    if(b){ setVersionText(b, p.ver || 0, t.value); autoGrow(t); save(); }
    return;
  }
  if(t.dataset && t.dataset.drafttext){
    const dr = findDraft(active(), t.dataset.drafttext);
    if(dr){ dr.text = t.value; autoGrow(t); save(); }
    return;
  }
  if(!t.dataset || !t.dataset.btext) return;
  const b = bulletById(t.dataset.btext);
  if(b){
    // Edit the version currently on show — the one the user is looking at.
    const p = placeOf(active(), t.dataset.btext) || { ver: 0 };
    setVersionText(b, p.ver || 0, t.value);
    autoGrow(t);
    renderPreviewSoon();
    save();
  }
});

let previewTimer;
function renderPreviewSoon(){
  clearTimeout(previewTimer);
  previewTimer = setTimeout(() => { if(ui.shelfEdit || ui.sbEdit) return; renderPreview(); }, 400);
}

docEl.addEventListener('click', e => {
  const t = e.target.closest('button');
  if(!t) return;
  const v = active();
  const d = t.dataset;
  if(d.draftadd){
    e.stopPropagation();
    const nd = { id: uid('dr'), text: '', level: 0 };
    draftsOf(v).push(nd);
    ui.draftEdit = nd.id;
    save(); render();
    requestAnimationFrame(() => {
      const ta = docEl.querySelector(`textarea[data-drafttext="${nd.id}"]`);
      if(ta && ta.focus){ ta.focus(); autoGrow(ta); }
    });
    return;
  }
  if(d.draftedit){
    e.stopPropagation();
    ui.docEdit = null; ui.shelfEdit = null; ui.sbEdit = null;
    ui.draftEdit = d.draftedit;
    renderPreview();
    requestAnimationFrame(() => {
      const ta = docEl.querySelector(`textarea[data-drafttext="${d.draftedit}"]`);
      if(ta && ta.focus){ ta.focus(); autoGrow(ta); ta.setSelectionRange(ta.value.length, ta.value.length); }
    });
    return;
  }
  if(d.draftlvl){
    e.stopPropagation();
    const [id, dir] = d.draftlvl.split('|');
    const dr = findDraft(v, id);
    if(dr) dr.level = Math.max(0, Math.min(2, (dr.level || 0) + Number(dir)));
    ui.draftEdit = null;
    save(); render();
    return;
  }
  if(d.draftdel){
    e.stopPropagation();
    v.drafts = draftsOf(v).filter(x => x.id !== d.draftdel);
    if(ui.draftEdit === d.draftdel) ui.draftEdit = null;
    flashHistory('Draft deleted — Cmd/Ctrl+Z to undo');
    save(); render();
    return;
  }
  if(d.draftpromote){
    e.stopPropagation();
    const dr = findDraft(v, d.draftpromote);
    if(!dr || !String(dr.text || '').trim()){ flashHistory('Write something first'); return; }
    const targets = data.bullets.filter(b => eligible(b).length);
    const pick = targets.length
      ? prompt('Promote this draft.\n\nLeave blank for a NEW bullet, or type a number to add it as another version of:\n\n' +
          targets.slice(0, 12).map((b, i) => `${i + 1}. ${versionText(b, 0).slice(0, 70)}`).join('\n'), '')
      : '';
    if(pick === null) return;
    const n = parseInt(pick, 10);
    if(!isNaN(n) && n >= 1 && n <= Math.min(12, targets.length)){
      draftIntoVersion(v, d.draftpromote, targets[n - 1].id);
      flashHistory('Added as a new version');
    } else {
      draftToBullet(v, d.draftpromote);
      flashHistory('Promoted — set its jobs in the library');
    }
    ui.draftEdit = null;
    save(); render();
    return;
  }
  if(d.skillaside){
    e.stopPropagation();
    let gid = null;
    data.skillGroups.forEach(g => g.items.forEach(i => { if(i.id === d.skillaside) gid = g.id; }));
    if(gid) v.skillItems[gid] = skillSel(v, data.skillGroups.find(g => g.id === gid)).filter(x => x !== d.skillaside);
    save(); render();
    return;
  }
  if(d.eduaside){
    e.stopPropagation();
    v.eduOn[d.eduaside] = false;
    save(); render();
    return;
  }
  if(d.groupaside){
    e.stopPropagation();
    v.skillsOn[d.groupaside] = false;
    save(); render(); return;
  }
  if(d.draftsbelow){ e.stopPropagation(); ui.draftsBelow = true; save(); render(); return; }
  if(d.draftsabove){ e.stopPropagation(); ui.draftsBelow = false; save(); render(); return; }
  if(d.asidecollapse){ ui.asidePanelOpen = ui.asidePanelOpen === false; render(); return; }
  if(d.asidetoggle){
    e.stopPropagation();
    if(typeof ui.asideOpen !== 'object' || !ui.asideOpen) ui.asideOpen = {};
    ui.asideOpen[d.asidetoggle] = ui.asideOpen[d.asidetoggle] === false;
    render();
    return;
  }
  if(d.eduback){
    e.stopPropagation();
    v.eduOn[d.eduback] = true;
    save(); render(); return;
  }
  if(d.groupback){
    e.stopPropagation();
    v.skillsOn[d.groupback] = true;
    save(); render(); return;
  }
  if(d.setstate){
    e.stopPropagation();
    const [kind, id, which] = d.setstate.split('|');
    const st = itemState(v, kind, id);
    const on = !st.kept;
    setItemState(v, kind, id, { kept: on, worded: on });
    save(); render();
    return;
  }
  if(d.docdone){
    e.stopPropagation();
    const [k, id] = d.docdone.split('|');
    toggleDone(v, k, id);
    save(); render();
    return;
  }
  if(d.docver){
    e.stopPropagation();
    const [id, dir] = d.docver.split('|');
    const p = placeOf(v, id);
    if(p){

// ---- reorder printed bullets by dragging them inside their job ----
let docDrag = null;

docEl.addEventListener('dragstart', e => {
  const li = e.target.closest('[data-dragbullet]');
  if(!li){ e.preventDefault(); return; }
  docDrag = { id: li.dataset.dragbullet, zone: li.dataset.dragzone };
  li.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', docDrag.id); } catch(_){}
});

docEl.addEventListener('dragend', () => {
  docDrag = null;
  docEl.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging'));
  docEl.querySelectorAll('.docdropline').forEach(x => x.remove());
});

function docDropTarget(y){
  const rows = [...docEl.querySelectorAll('[data-dragbullet]')]
    .filter(r => r.dataset.dragzone === docDrag.zone && r.dataset.dragbullet !== docDrag.id);
  for(const r of rows){
    const box = r.getBoundingClientRect();
    if(y < box.top + box.height / 2) return r;
  }
  return null;
}

docEl.addEventListener('dragover', e => {
  if(!docDrag) return;
  const li = e.target.closest('[data-dragbullet]');
  if(!li || li.dataset.dragzone !== docDrag.zone) return;   // same job only
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  docEl.querySelectorAll('.docdropline').forEach(x => x.remove());
  const line = document.createElement('li');
  line.className = 'docdropline';
  const before = docDropTarget(e.clientY);
  if(before) before.parentNode.insertBefore(line, before);
  else li.parentNode.appendChild(line);
});

docEl.addEventListener('drop', e => {
  if(!docDrag) return;
  const li = e.target.closest('[data-dragbullet]');
  if(!li || li.dataset.dragzone !== docDrag.zone) return;
  e.preventDefault();
  const v = active();
  const before = docDropTarget(e.clientY);
  const beforeId = before ? before.dataset.dragbullet : null;
  const ord = orderIn(v, docDrag.zone);
  const from = ord.indexOf(docDrag.id);
  if(from > -1){
    ord.splice(from, 1);
    const to = beforeId ? ord.indexOf(beforeId) : ord.length;
    ord.splice(to < 0 ? ord.length : to, 0, docDrag.id);
  }
  docDrag = null;
  docEl.querySelectorAll('.docdropline').forEach(x => x.remove());
  save(); render();
});

function maybeAutoBackup(){
  const every = Number(data.autoBackupEvery || 0);
  if(!every) return;

function downloadBackup(tag){
  const stamp = new Date().toISOString().slice(0,16).replace(/[:T]/g, '-');
  const name = `resume-data-${stamp}${tag ? '-' + tag : ''}.json`;
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
  return name;
}

function storageReport(){
  const lines = [];
  const has = t => { try { return t(); } catch(e){ return 'threw: ' + e.message; } };
  lines.push('mode: ' + mode);
  lines.push('storageOk: ' + storageOk);
  lines.push('lastError: ' + (lastError || 'none'));
  lines.push('lastSavedAt: ' + (lastSavedAt ? new Date(lastSavedAt).toISOString() : 'never'));
  lines.push('window.storage exists: ' + has(() => typeof window.storage));
  lines.push('window.storage.set: ' + has(() => typeof (window.storage && window.storage.set)));
  lines.push('localStorage usable: ' + has(() => {
    const t = KEY + '::diag';
    window.localStorage.setItem(t, '1');
    const v = window.localStorage.getItem(t);
    window.localStorage.removeItem(t);
    return v === '1';
  }));
  lines.push('localStorage keys: ' + has(() => {
    const out = [];
    for(let i = 0; i < window.localStorage.length; i++){
      const k = window.localStorage.key(i);
      if(k && k.indexOf(KEY) === 0) out.push(k);
    }
    return out.join(', ') || 'none for this app';
  }));
  lines.push('data size: ' + (JSON.stringify(data).length / 1024).toFixed(1) + ' KB');
  if(lastFailure){
    lines.push('--- last save failure ---');
    lines.push('payload: ' + lastFailure.kb.toFixed(1) + ' KB' + (lastFailure.degraded ? ' (saved slim instead)' : ''));
    lastFailure.errs.forEach(x => lines.push('  ' + x));
  }
  sizeReport().slice(0, 4).forEach(([k, v]) => lines.push(`  ${k}: ${v.toFixed(1)} KB`));
  return lines.join('\n');
}

function sizeReport(){
  const parts = [];
  const kb = o => (JSON.stringify(o || null).length / 1024);
  parts.push(['Bullets', kb(data.bullets)]);
  parts.push(['Variants', kb(data.variants)]);
  parts.push(['Pasted job postings', data.variants.reduce((n, v) => n + (v.posting || '').length, 0) / 1024]);
  parts.push(['Requirement cards', data.variants.reduce((n, v) => n + kb(v.cards), 0)]);
  parts.push(['Saved summaries', kb(data.summaries)]);
  parts.push(['Notes', kb(data.notes)]);
  parts.push(['References', kb(data.refs)]);
  parts.push(['Roles + application details', kb(data.roles)]);
  return parts.sort((a, b) => b[1] - a[1]);
}

async function compactData(){
  const total = JSON.stringify(data).length / 1024;
  const report = sizeReport().map(([k, v]) => `  ${k}: ${v.toFixed(1)} KB`).join('\n');
  const postings = data.variants.filter(v => (v.posting || '').length > 200);
  if(!postings.length){
    alert(`This file is ${total.toFixed(0)} KB.\n\n${report}\n\n` +
          `No pasted posting text to clear — nothing to compact.`);
    return;
  }
  const msg = `This file is ${total.toFixed(0)} KB.\n\n${report}\n\n` +
    `Clear the pasted posting text from ${postings.length} variant(s)?\n\n` +
    `This DELETES that text. A full backup file will download first so nothing is lost, ` +
    `and every posting link, requirement card, bullet and setting stays.`;
  if(!confirm(msg)) return;

  downloadBackup('before-compact');            // safety copy, always
  postings.forEach(v => { v.posting = ''; });
  dropSnapshots();
  const after = JSON.stringify(data).length / 1024;
  save(); render();
  alert(`Now ${after.toFixed(0)} KB — freed ${(total - after).toFixed(0)} KB.\n\n` +
        `A backup was downloaded first; restore it if you need the posting text back.`);
}

  catch(e){ writeResult = 'write FAILED (' + mode + '): ' + e.message; }

  catch(e){ readBack = 'read FAILED: ' + e.message; }
  const report = before + '\n' + writeResult + '\n' + readBack;

}

// ---- pre-flight ----
function preflight(){
  const v = active();
  const issues = [];
  const doc = buildDoc();

  const fit = pageFill();
  if(fit.pages > 1 && fit.pages < 1.25) issues.push(`Spills just over one page (${Math.round(fit.pages*100)}%) — the worst place to land.`);
  else if(fit.whole === 1 && fit.fill < 0.8) issues.push(`Only fills ${Math.round(fit.fill*100)}% of the page — it will read as thin.`);

  if(!(v.roleTitle || '').trim()) issues.push('No role title set, so the headline is blank.');
  if(v.showSummary && !(v.summary || '').trim()) issues.push('Summary is switched on but empty.');

  const placed = [];
  data.sections.forEach(sec => data.roles.filter(r => rset(v, r).place === sec.id)
    .forEach(r => orderIn(v, r.id).forEach(id => placed.push(id))));
  if(!placed.length) issues.push('No bullets are placed under any job.');
  const noNumbers = placed.filter(id => {
    const b = bulletById(id), p = placeOf(v, id) || { ver: 0 };
    return b && !/\d/.test(versionText(b, p.ver));
  });
  if(placed.length && noNumbers.length === placed.length) issues.push('Not one bullet contains a number.');

  if(orderIn(v, 'staging').length) issues.push(`${orderIn(v,'staging').length} bullet(s) still in Staging — they will not print.`);
  if(!(data.profile.name || '').trim()) issues.push('No name in the header.');
  if(!/@/.test(data.profile.line1 || '')) issues.push('No email address in the contact line.');
  if(doc.text.length < 400) issues.push('The document looks very short — check the right variant is selected.');

  return issues;
}
