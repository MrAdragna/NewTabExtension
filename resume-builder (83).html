// v2 model: bullets live in one global pool. Each carries the categories it belongs
// to plus per-job add/exclude overrides. Eligibility is computed, never stored.
function migrateBullets(d){
  if(Array.isArray(d.bullets)) return d;
  d.bullets = [];
  d.categories = d.categories || [];
  (d.roles || []).forEach(r => {
    (r.bullets || []).forEach(b => {
      d.bullets.push({ id:b.id, text:b.text || '', tags:b.tags || [], cats:[], add:[r.id], ex:[] });
    });
  });
  d.variants.forEach(v => {
    v.place = v.place || {};
    v.order = v.order || {};
    Object.keys(v.roles || {}).forEach(rid => {
      const rs = v.roles[rid];
      if(!rs || rs.place === 'off') return;
      (rs.bullets || []).forEach(bid => {
        v.place[bid] = { at: rid, ver: 0 };
        (v.order[rid] = v.order[rid] || []).push(bid);
      });
    });
  });
  (d.roles || []).forEach(r => { delete r.bullets; });
  return d;
}

function migrate(d){
  migrateBullets(d);
  if(!d.sections){
    d.sections = [{ id:'sec_exp', label:'Experience' }];
    if(d.roles.some(r => r.section === 'projects')) d.sections.push({ id:'sec_prj', label:'Projects' });
    d.roles.forEach(r => { r.sectionId = r.section === 'projects' ? 'sec_prj' : 'sec_exp'; delete r.section; });
  }
  d.roles.forEach(r => { if(!d.sections.some(s => s.id === r.sectionId)) r.sectionId = d.sections[0].id; });
  d.skillGroups.forEach(g => {
    if(typeof g.items === 'string'){
      g.items = g.items.split(',').map(t => t.trim()).filter(Boolean).map(t => ({ id: uid('si'), text: t }));
    }
  });
  d.variants.forEach(v => {
    if(!v.skillItems) v.skillItems = {};
    d.skillGroups.forEach(g => {
      if(!v.skillItems[g.id]){
        const ov = v.skillOverride && v.skillOverride[g.id];
        if(ov && ov.trim()){
          const wanted = ov.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
          v.skillItems[g.id] = g.items.filter(i => wanted.includes(i.text.toLowerCase())).map(i => i.id);
          if(!v.skillItems[g.id].length) v.skillItems[g.id] = g.items.map(i => i.id);
        } else v.skillItems[g.id] = g.items.map(i => i.id);
      }
    });
    delete v.skillOverride;
    if(v.roleTitle === undefined && v.employer === undefined){
      const parts = String(v.note || '')
        .split(/\s*(?:[\u00b7|;]|\s[\u2013\u2014-]\s)\s*/).map(x=>x.trim()).filter(Boolean)
        .filter(x => !/(closes?|due|applied|deadline|interview|posted)|\d{1,2}\/\d{1,2}/i.test(x));
      v.roleTitle = parts[0] || '';
      v.employer = parts[1] || '';
    }
    if(!Array.isArray(v.cards)) v.cards = [];
    if(v.status === undefined) v.status = '';
    if(v.posting === undefined) v.posting = '';
    if(v.postingUrl === undefined) v.postingUrl = '';
  });
  d.variants.forEach(v => {
    if(!Array.isArray(v.drafts)) v.drafts = [];
    Object.keys(v.place || {}).forEach(bid => {
      if(v.place[bid].at !== 'staging') return;
      const b = (d.bullets || []).find(x => x.id === bid);
      if(b) v.drafts.push({ id: uid('dr'), text: b.text || '', level: 0 });
      delete v.place[bid];
    });
    if(v.order) delete v.order.staging;
  });
  normalize(d);
  return d;
}

// Every variant gets a complete, current entry for every role, bullet, skill and school.
// Anything added to the library since the variant was made shows up selected; anything
// deleted stops lingering as a dangling id.
// Older versions could leave a variant pointing at a section id that no longer
// exists, or leave two sections with the same label. Both strand a job in a list
// of its own. Fold duplicates together and re-home anything orphaned.
const SEC_MAIN = 'sec_exp', SEC_ADD = 'sec_add';

// Exactly two sections, always. Their headings are fixed; only the formatting of
// Additional Experience varies, and that lives on the variant.
function ensureSections(d){
  const main = d.sections.find(x => x.id === SEC_MAIN) || d.sections[0];
  let add = d.sections.find(x => x.id === SEC_ADD)
         || d.sections.find(x => x !== main && /additional|other/i.test(x.label || ''));
  const remap = {};
  d.sections.forEach(x => {
    if(x === main || x === add) return;
    remap[x.id] = add ? add.id : main.id;      // fold any stray section into Additional
  });
  const fixed = [
    { id: SEC_MAIN, label: 'Experience', style: 'full' },
    { id: SEC_ADD,  label: 'Additional Experience' },
  ];
  if(main && main.id !== SEC_MAIN) remap[main.id] = SEC_MAIN;
  if(add && add.id !== SEC_ADD) remap[add.id] = SEC_ADD;
  d.sections = fixed;
  const fix = id => remap[id] || (id === SEC_MAIN || id === SEC_ADD ? id : SEC_MAIN);
  d.roles.forEach(r => { r.sectionId = fix(r.sectionId); });
  d.variants.forEach(v => Object.values(v.roles || {}).forEach(rs => {
    if(rs && rs.place && rs.place !== 'off') rs.place = fix(rs.place);
  }));
}

function repairSections(d){
  const byLabel = new Map();
  const remap = {};
  d.sections = d.sections.filter(sec => {
    const key = (sec.label || '').trim().toLowerCase();
    if(key && byLabel.has(key)){ remap[sec.id] = byLabel.get(key); return false; }
    if(key) byLabel.set(key, sec.id);
    return true;
  });
  if(!d.sections.length) d.sections = [{ id:'sec_exp', label:'Experience' }];
  const valid = new Set(d.sections.map(x => x.id));
  const fallback = d.sections[0].id;
  const fix = id => remap[id] || (valid.has(id) ? id : fallback);

  d.roles.forEach(r => { r.sectionId = fix(r.sectionId); });
  // Sections with no jobs placed in ANY variant and no distinct purpose are safe to
  // leave; the variant editor no longer groups by them, so nothing can strand.
  d.variants.forEach(v => {
    Object.keys(v.roles || {}).forEach(rid => {
      const rs = v.roles[rid];
      if(rs && rs.place && rs.place !== 'off') rs.place = fix(rs.place);
    });
  });
  return Object.keys(remap).length;
}

function normalize(d){
  ensureSections(d);
  d.bullets = d.bullets || [];
  d.categories = d.categories || [];
  d.variants.forEach(v => {
    if(!v.roles) v.roles = {};
    d.roles.forEach(r => {
      let rs = v.roles[r.id];
      if(!rs) rs = v.roles[r.id] = { place: r.sectionId || SEC_MAIN, title:'' };
      if(rs.place === undefined) rs.place = rs.include === false ? 'off' : (r.sectionId || SEC_MAIN);
      delete rs.include; delete rs.bullets; delete rs.seen;
      // Only 'off' or a real section id is valid; anything else falls back to Experience.
      if(rs.place !== 'off' && !d.sections.some(x => x.id === rs.place)) rs.place = SEC_MAIN;
    });
    Object.keys(v.roles).forEach(id => { if(!d.roles.some(r => r.id === id)) delete v.roles[id]; });

    // Drop placements pointing at bullets or zones that no longer exist.
    v.place = v.place || {};
    v.order = v.order || {};
    Object.keys(v.place).forEach(bid => {
      const b = d.bullets.find(x => x.id === bid);
      const at = v.place[bid].at;
      const zoneOk = at === 'shelf' || at === 'staging' || at === 'backburner' || d.roles.some(r => r.id === at);
      if(!b || !zoneOk) delete v.place[bid];
    });
    Object.keys(v.order).forEach(z => {
      v.order[z] = (v.order[z] || []).filter(id => v.place[id] && v.place[id].at === z);
    });
    if(v.keep) Object.keys(v.keep).forEach(id => { if(!v.place[id]) delete v.keep[id]; });

    // Staging used to hold real library bullets. Convert them to variant-local drafts
    // and remove the ones that exist nowhere else.
    if(!Array.isArray(v.drafts)) v.drafts = [];
    Object.keys(v.place).forEach(bid => {
      if(v.place[bid].at !== 'staging') return;
      const b = d.bullets.find(x => x.id === bid);
      if(b){
        v.drafts.push({ id: uid('dr'), text: b.text || '', level: 0, keep: !!(v.keep && v.keep[bid]) });
        const usedElsewhere = d.variants.some(o => o !== v && o.place && o.place[bid]);
        const eligibleAnywhere = (b.cats || []).length || (b.add || []).length;
        if(!usedElsewhere && !eligibleAnywhere) d.bullets = d.bullets.filter(x => x.id !== bid);
      }
      delete v.place[bid];
      if(v.keep) delete v.keep[bid];
    });
    if(v.order) delete v.order.staging;

    if(!v.skillItems) v.skillItems = {};
    if(!v.skillsOn) v.skillsOn = {};
    d.skillGroups.forEach(g => {
      if(v.skillsOn[g.id] === undefined) v.skillsOn[g.id] = true;
      if(!Array.isArray(v.skillItems[g.id])) v.skillItems[g.id] = g.items.map(i=>i.id);
      if(!v.skillSeen) v.skillSeen = {};
      if(!Array.isArray(v.skillSeen[g.id])) v.skillSeen[g.id] = v.skillItems[g.id].slice();
      const seen = new Set(v.skillSeen[g.id]);
      v.skillItems[g.id] = v.skillItems[g.id].filter(id => g.items.some(i => i.id === id));
      g.items.forEach(i => { if(!seen.has(i.id)) v.skillItems[g.id].push(i.id); });
      v.skillSeen[g.id] = g.items.map(i => i.id);
    });

    delete v.headlineAuto;
    v.headline = '';                        // recomputed from roleTitle on every render
    if(!v.wideRange){
      Object.keys(BOUNDS_CONV).forEach(k => {
        if(typeof v[k] === 'number') v[k] = Math.min(BOUNDS_CONV[k][1], Math.max(BOUNDS_CONV[k][0], v[k]));
      });
    }
    if(!v.eduOn) v.eduOn = {};
    d.education.forEach(e => { if(v.eduOn[e.id] === undefined) v.eduOn[e.id] = true; });
  });
}

// Flags a placement that is no longer allowed by the bullet's eligibility.
function strandedIn(v){
  const out = [];
  Object.keys(v.place || {}).forEach(bid => {
    const at = v.place[bid].at;
    if(at === 'shelf' || at === 'staging' || at === 'backburner') return;
    const b = bulletById(bid);
    if(b && !isEligible(b, at)) out.push(bid);
  });
  return out;
}

window.addEventListener('error', e => {
  const bar = document.getElementById('storageBar');
  if(!bar) return;
  bar.hidden = false;
  document.getElementById('barText').innerHTML =
    '<strong>Something broke.</strong> ' + esc(String(e.message || '')).slice(0,200) +
    ' — your data is unaffected; reload the page.';
});

/* ---------------- undo / redo ---------------- */
// Snapshots of the whole data object. Rapid edits (typing) coalesce into one entry.
let undoStack = [], redoStack = [], histPrev = null, histAt = 0, applyingHistory = false;
const HIST_MAX = 60, HIST_COALESCE = 900;

function pushHistory(){
  if(applyingHistory) return;
  if(histPrev === null){ histPrev = JSON.stringify(data); return; }
  const now = Date.now();
  const cur = JSON.stringify(data);
  if(cur === histPrev) return;
  if(now - histAt < HIST_COALESCE && undoStack.length){
    // still the same burst of typing — leave the earlier snapshot as the undo point
  } else {
    undoStack.push(histPrev);
    if(undoStack.length > HIST_MAX) undoStack.shift();
    redoStack = [];
  }
  histPrev = cur;
  histAt = now;
}

function applySnapshot(json){
  applyingHistory = true;
  const keepId = data.activeId, keepTab = ui.tab;
  data = JSON.parse(json);
  if(data.variants.some(v => v.id === keepId)) data.activeId = keepId;
  ui.tab = keepTab;
  histPrev = json;
  applyingHistory = false;
  unsaved = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { attemptSave().then(updateSaveState); }, 400);
  render();
  updateSaveState();
}

function undo(){
  if(!undoStack.length){ flashHistory('Nothing to undo'); return; }
  redoStack.push(JSON.stringify(data));
  applySnapshot(undoStack.pop());
  flashHistory('Undo');
}
function redo(){
  if(!redoStack.length){ flashHistory('Nothing to redo'); return; }
  undoStack.push(JSON.stringify(data));
  applySnapshot(redoStack.pop());
  flashHistory('Redo');
}

let flashTimer;
function flashHistory(msg){
  let el = document.getElementById('histFlash');
  if(!el){
    el = document.createElement('div');
    el.id = 'histFlash';
    el.className = 'histflash';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => el.classList.remove('on'), 900);
}

document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey;
  if(!mod || e.key.toLowerCase() !== 'z') return;
  const t = e.target;
  // Let the browser handle undo inside a field the user is actively typing in.
  const typing = t && (t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && t.type === 'text'));
  if(typing && !e.shiftKey) return;
  e.preventDefault();
  e.shiftKey ? redo() : undo();
});

/* ---------------- notes ---------------- */
// Kept on data (so they ride along in backups) rather than per variant.
// Flush now rather than on the debounce; there is no rate-limit risk here.
function saveNow(){
  clearTimeout(saveTimer);
  unsaved = true;
  attemptSave().then(updateSaveState).catch(() => {});
}

function notesList(){
  if(!Array.isArray(data.notes)) data.notes = [];
  data.notes.forEach(n => {
    if(!n.id) n.id = uid('n');
    if(n.deleted === undefined) n.deleted = !!n.done;   // old "done" becomes archived
    if(n.sel === undefined) n.sel = false;
    delete n.done;
  });
  return data.notes;
}

function renderNotes(){
  const list = notesList();
  const live = list.filter(n => !n.deleted);
  const gone = list.filter(n => n.deleted);
  const sel = live.filter(n => n.sel).length;

  const badge = document.getElementById('notesBadge');
  badge.hidden = live.length === 0;
  badge.textContent = live.length;

  const el = document.getElementById('notesList');
  el.innerHTML = (live.length ? live.map(n => `
    <label class="notes-item ${n.sel?'sel':''}">
      <input type="checkbox" ${n.sel?'checked':''} data-notesel="${n.id}" title="Select">
      <span>${esc(n.text)}<span class="notes-when">${esc(n.at || '')}</span></span>
      <button class="arrow" data-notedel="${n.id}" title="Move to done">✓</button>
    </label>`).join('')
    : '<div class="notes-empty">No notes yet. Jot down anything you want changed and it will be here next time.</div>')
    + (gone.length ? `
    <div class="notes-arch">
      <button class="notes-archhead" id="notesArchToggle">${ui.notesArchOpen ? '▾' : '▸'} Done — ${gone.length}</button>
      ${ui.notesArchOpen ? gone.map(n => `
        <label class="notes-item done">
          <span>${esc(n.text)}</span>
          <button class="arrow" data-noteback="${n.id}" title="Restore">↺</button>
          <button class="arrow" data-notepurge="${n.id}" title="Delete for good">×</button>
        </label>`).join('') : ''}
    </div>` : '');

  const copyBtn = document.getElementById('notesCopy');
  copyBtn.textContent = sel ? `Copy ${sel}` : 'Copy all';
}

document.getElementById('notesFab').onclick = () => {
  const p = document.getElementById('notesPanel');
  p.hidden = !p.hidden;
  if(!p.hidden){ renderNotes(); document.getElementById('notesInput').focus(); }
};
document.getElementById('notesClose').onclick = () => {
  document.getElementById('notesPanel').hidden = true;
  saveNow();
};

function addNote(){
  const ta = document.getElementById('notesInput');
  const text = ta.value.trim();
  if(!text) return;
  notesList().push({ id: uid('n'), text, sel:false, deleted:false, at:new Date().toLocaleDateString() });
  ta.value = '';
  growNotes();
  saveNow(); renderNotes();
}
document.getElementById('notesAdd').onclick = addNote;
function growNotes(){
  const ta = document.getElementById('notesInput');
  ta.style.height = 'auto';
  ta.style.height = Math.min(150, ta.scrollHeight + 2) + 'px';
}
document.getElementById('notesInput').addEventListener('input', growNotes);

document.getElementById('notesInput').addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); addNote(); }
});

const findNote = id => notesList().find(n => n.id === id);

document.getElementById('notesList').addEventListener('change', e => {
  const id = e.target.dataset.notesel;
  if(!id) return;
  const n = findNote(id);
  if(n){ n.sel = e.target.checked; saveNow(); renderNotes(); }
});

document.getElementById('notesList').addEventListener('click', e => {
  const b = e.target.closest('button');
  if(!b) return;
  e.preventDefault();
  if(b.id === 'notesArchToggle'){ ui.notesArchOpen = !ui.notesArchOpen; renderNotes(); return; }
  const n = findNote(b.dataset.notedel || b.dataset.noteback || b.dataset.notepurge);
  if(!n) return;
  if(b.dataset.notedel){ n.deleted = true; n.sel = false; }
  else if(b.dataset.noteback){ n.deleted = false; }
  else if(b.dataset.notepurge){ data.notes = notesList().filter(x => x.id !== n.id); }
  saveNow(); renderNotes();
});

document.getElementById('notesCopy').onclick = async () => {
  const live = notesList().filter(n => !n.deleted);
  const picked = live.filter(n => n.sel);
  const txt = (picked.length ? picked : live).map(n => '- ' + n.text).join('\n');
  const btn = document.getElementById('notesCopy');
  try { await navigator.clipboard.writeText(txt); btn.textContent = 'Copied'; }
  catch(e){ btn.textContent = 'Copy blocked'; }
  setTimeout(() => btn.textContent = 'Copy all', 1600);
};

/* ---------------- boot ---------------- */
(async function(){
  data = await load();
  if(data) data = migrate(data);
  if(!data){
    data = sampleData();
    ensureSections(data);
    const base = newVariant('Base — everything');
    data.variants.push(base);
    data.activeId = base.id;
    save();
  }
  if(!data.activeId || !active()) data.activeId = data.variants[0]?.id;
  if(!data.uiScale) data.uiScale = 0.8;
  const ab = document.getElementById('autoBackup');
  if(ab) ab.value = String(data.autoBackupEvery || 0);
  render();
  applyScaleRepeatedly();
  updateBar();
  updateBackupBar();
  renderNotes();
  snapshot();
  histPrev = JSON.stringify(data);   // baseline so the first edit is undoable
  updateSaveState();
  snapshot();
  window.addEventListener('resize', applyScale);

})();
</script>
